<title>Zonnestuur instellen</title>
<style>
/* In een app-webweergave: doorslepen bovenaan mag niet doorgaan naar 'trek omlaag om te verversen' van de app. */

      --sun: #ffb224; --sun-ink: #ffb224; --sun-soft: rgba(255,178,36,.14); --net: #5b8cff;
      --good: #4ade80; --good-soft: rgba(74,222,128,.12); --warn: #fdb022; --warn-soft: rgba(253,176,34,.12);

  label.schakel span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }

  details.installateur { margin-top: 16px; }

  details#b_adv.blok > summary b { color: var(--ink); font-size: 15.5px; } details#b_adv.blok > summary b::after { content: " ›"; color: var(--ink-3); }
  details#b_adv.blok > summary .blok-uitleg { font-weight: 400; margin-top: 4px; }
  @media (max-width: 520px) { .blok-in { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .tile svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tile.on { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); color: var(--sun-ink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }

  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .live { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 18px; background: var(--card-solid); border: 1px solid var(--line); }
  .live .big { font-size: 40px; font-weight: 650; font-variant-numeric: tabular-nums; }

  .pulse.off { background: var(--warn); animation: none; }

  .test { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--chip); margin: 6px 0 16px; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--sun); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
  .err { color: var(--warn); font-size: 14px; min-height: 1.2em; margin-top: 10px; }

<body>
<main>
  <header class="top">
    <a class="brand" href="./"><img src="icon.svg" alt="">Zonnestuur</a>
    <div class="spacer"></div>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </header>
  <div id="app"></div>
  <p class="err" id="err" role="alert"></p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// Fouten in dit scherm melden aan Zonnestuur (die filtert en ontdubbelt); netwerkhaperingen tellen niet mee.
window.zsFout = (function () { let n = 0; return function (msg, where) {
  msg = String((msg && msg.message) || msg || ""); if (!msg || n++ > 5 || /Failed to fetch|NetworkError|Load failed|AbortError|HTTP 5\d\d|ResizeObserver/i.test(msg)) return;
  let t = ""; try { t = localStorage.getItem("zs_token") || ""; } catch (e) {}
  try { fetch("api/fout", { method: "POST", headers: { "Content-Type": "application/json", "X-Token": t }, body: JSON.stringify({ msg: msg.slice(0, 500), where: (String(where || "") + "\n" + location.pathname).slice(0, 3000) }) }).catch(() => {}); } catch (e) {}
}; })();
addEventListener("error", (e) => zsFout(e.message, (e.error && e.error.stack) || `${e.filename}:${e.lineno}:${e.colno}`));
addEventListener("unhandledrejection", (e) => zsFout(e.reason, e.reason && e.reason.stack));

// ---------- hulpjes ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl = (v, d = 0) => Number(v ?? 0).toLocaleString("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d });
let token = "";
try { token = localStorage.getItem("zs_token") || ""; } catch (e) {}
async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-Token": token, "Content-Type": "application/json" }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    const t = window.prompt ? prompt("Wachtwoord voor Zonnestuur") : "";
    token = t || ""; try { localStorage.setItem("zs_token", token); } catch (e) {}
    return api(path, opts);
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Er ging iets mis (" + r.status + ")");
  return data;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

function nearestRegion(lat, lon) {
  let best = "Gelderland", bd = 1e9;
  for (const [k, [a, b]] of Object.entries(REGIONS)) { const d = (a - lat) ** 2 + (b - lon) ** 2; if (d < bd) { bd = d; best = k; } }
  return best;
}
function slug(s) { return (s || "apparaat").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "apparaat"; }

// ---------- stap 2: zoeken ----------
let FOUND = [];
function zoeken() {
  $("app").innerHTML = `<section class="card">
    <div class="eyebrow">Stap 2</div>
    <h1 class="t">Apparaten zoeken</h1>
    <p class="lead" id="scanText">We kijken welke apparaten er in je netwerk zijn…</p>
    <div class="bar"><span id="scanBar"></span></div>
    <div id="found"></div>
    ${W.addOnly ? "" : `<label class="check-row" style="margin-top:16px"><input type="checkbox" id="noPanels" ${W.noPanels ? "checked" : ""}> Ik heb geen zonnepanelen <span class="muted">— dan is geen meter nodig en draait alles in de goedkoopste uren (dynamisch contract nodig)</span></label>`}
    <details id="manual"><summary>Staat je apparaat er niet bij? Vul het IP-adres in</summary>
      <div class="row" style="margin-top:12px">
        <div class="field"><label for="manualIp">IP-adres</label><input id="manualIp" placeholder="192.168.1.50" inputmode="decimal" autocomplete="off"><span class="hint">Te vinden in de app van het apparaat, onder apparaatinformatie.</span></div>

      </div></details>
    <div class="actions"><button class="btn ghost" id="back">← Terug</button>
      <div class="row"><button class="btn ghost small" id="again">Opnieuw zoeken</button><button class="btn" id="next" disabled>Verder →</button></div></div>
  </section>`;
  $("back").onclick = () => go(0);
  $("again").onclick = startScan;
  $("next").onclick = () => go(W.addOnly || !W.meter ? 3 : 2);
  if ($("noPanels")) $("noPanels").onchange = () => { W.noPanels = $("noPanels").checked; if (W.noPanels) W.contract.type = "dynamic"; renderFound(); };
  $("manualBtn").onclick = async () => {
    const host = $("manualIp").value.trim();
    if (!host) return;
    setErr("");
    try {
      const r = await api("api/setup/identify", { method: "POST", body: JSON.stringify({ host }) });
      if (!r.found) { setErr(`Op ${host} vonden we geen meter of schakelaar die we kennen. Klopt het adres?`); return; }
      r.found._manual = true;
      FOUND = FOUND.filter((f) => f.host !== r.found.host).concat(r.found);
      renderFound();
    } catch (e) { setErr(e.message); }
  };
  startScan();
  if (CFG.has_ha && !W.ha.cands) loadHA();
}
async function startScan() {
  try {
    await api("api/setup/scan", { method: "POST", body: "{}" });
    clearInterval(scanTimer);
    scanTimer = setInterval(pollScan, 1000);
    pollScan();
  } catch (e) { setErr(e.message); }
}
async function pollScan() {
  try {
    const s = await api("api/setup/scan");
    const manual = FOUND.filter((f) => !s.found.some((x) => x.host === f.host) && f._manual);
    FOUND = s.found.concat(manual);
    if ($("scanBar")) $("scanBar").style.width = Math.round(s.progress * 100) + "%";
    if ($("scanText")) $("scanText").textContent = s.running ? "We kijken welke apparaten er in je netwerk zijn…"
      : FOUND.length || (W.ha.cands && W.ha.cands.devices.length) ? "Klaar met zoeken. Kies wat bij Zonnestuur hoort." : "We vonden niets. Staan de apparaten op dezelfde wifi? Of vul hieronder het IP-adres in.";
    if (!s.running) clearInterval(scanTimer);
    renderFound();
  } catch (e) { clearInterval(scanTimer); setErr(e.message); }
}
async function loadHA() {
  try {
    const r = await api("api/setup/ha");
    if (r.ok) { W.ha.connected = true; W.ha.cands = r; renderFound(); }
  } catch (e) {}
}
async function connectHA() {
  const url = $("haUrl").value.trim(), tok = $("haTok").value.trim();
  $("haMsg").textContent = "Verbinden…";
  try {
    const r = await api("api/setup/ha", { method: "POST", body: JSON.stringify({ url, token: tok }) });
    if (!r.ok) { $("haMsg").textContent = r.error; return; }
    W.ha = { connected: true, url, cands: r, open: false };
    CFG = await api("api/config");
    toast(`Gekoppeld: ${r.devices.length} apparaten gevonden`);
    renderFound();
  } catch (e) { $("haMsg").textContent = e.message; }
}

      </div>${ok && !taken ? '<span class="mark"></span>' : ""}</div>`;
  const foundCard = (f, asMeter) => {
    const key = "f:" + f.host;
    const sel = asMeter ? W.meter && W.meter.host === f.host && W.meter.type !== "ha" : picked(key);
    let meta = esc(f.host);
    if (f.ok && f.kind === "p1_serial") meta = `P1-kabel in dit kastje · leest nu ${nl(Math.abs(f.extra.active_power_w) / 1000, 2)} kW ${f.extra.active_power_w < 0 ? "teruglevering" : "afname"}`;
    else if (f.ok && f.kind === "p1") meta += ` · leest nu ${nl(Math.abs(f.extra.active_power_w) / 1000, 2)} kW ${f.extra.active_power_w < 0 ? "teruglevering" : "afname"}`;
    else if (f.ok && f.kind === "shelly_em") meta += " · meet het hele huis";
    else if (f.ok) meta += f.extra && f.extra.metering ? " · meet ook verbruik" : " · meet geen verbruik";
    return card(key, asMeter ? "meter" : "found", ICONS[f.kind] || ICONS.generic, f.name || f.model, meta, sel, f.ok, esc(f.problem_text), !asMeter && inUse.has(f.host));
  };
  let html = "";
  const cands = W.ha.connected && W.ha.cands;
  if (!W.addOnly) {

      const sensors = cands.power_sensors.filter((p) => !p.export).slice(0, 6);
      haMeters = sensors.map((p) => {
        const exp = p.export_entity ? cands.power_sensors.find((q) => q.entity === p.export_entity) : null;
        return card("m:" + p.entity, "hameter", ICONS.ha, p.name,
          `${esc(p.entity)} · nu ${esc(p.state)} ${esc(p.unit)}${exp ? ` · teruglevering via ${esc(exp.name)}` : ""}`,
          W.meter && W.meter.type === "ha" && W.meter.entity === p.entity, true, "", false);
      }).join("");
    }
    html += `<div class="group-title">Meter</div><div class="list">${meters.map((f) => foundCard(f, true)).join("") + haMeters ||
      '<p class="small muted">Nog geen meter gevonden. Heb je een eigen domoticaserver? Koppel hem hieronder, dan kun je daar een meter kiezen.</p>'}</div>`;
  }
  html += `<div class="group-title">Slimme stekkers en schakelaars</div><div class="list">${sw.length ? sw.map((f) => foundCard(f, false)).join("") : '<p class="small muted">Nog niets gevonden.</p>'}</div>`;
  html += `<div class="group-title">Uit de koppelmotor</div>`;
  if (cands) {
    html += `<p class="small muted" style="margin:-4px 0 10px">Gekoppeld met ${esc(W.ha.url || CFG.homeassistant?.url || "de koppelmotor")}. Kies wat Zonnestuur mag sturen.</p><div class="list">${
      cands.devices.length ? cands.devices.map((c) => {
        const ent = c.entity || c.current_entity || c.button_entity, key = "h:" + ent;
        const what = c.driver === "ha_start_button" ? "programma starten bij zon" : c.driver === "ha_current" ? "laadstroom traploos regelen" : c.driver === "ha_setpoint" ? `temperatuur ${nl(c.normal_temp, 1)} → ${nl(c.boost_temp, 1)} °C bij zon` : "aan/uit";
        const taken = (CFG?.devices || []).some((d) => d.params && (d.params.entity === ent || d.params.current_entity === ent || d.params.button_entity === ent));
        return card(key, "ha", ICONS[c.kind] || ICONS.generic, c.name, `${esc(ent)} · ${what}${c.warning ? ` · <b style="color:var(--warn,#e5484d)">${esc(c.warning)}</b>` : ""}`, picked(key), true, "", taken);
      }).join("") : '<p class="small muted">We vonden geen schakelaars, thermostaten of laadpalen.</p>'}</div>
      ${(cands.readonly_chargers || []).map((r) => `<div class="problem" style="margin-top:10px"><b>Laadpaal ${esc(r.name)} gevonden, maar nog niet te sturen.</b> Hij is nu alleen uit te lezen (via ${esc(r.via)}). ${r.brand === "zaptec" ? "Koppel bij <a href=\"koppelen\">Koppelen</a> het merk <b>Zaptec</b> en log in met je Zaptec-account; daarna staat hij hier met laadstroom erbij." : "Koppel het merk van je laadpaal bij <a href=\"koppelen\">Koppelen</a>; daarna staat hij hier."}</div>`).join("")}`;

    html += `<details id="haBox" ${W.ha.open ? "open" : ""}><summary>Koppel je eigen domoticaserver voor warmtepompen, laadpalen en auto's</summary>

      <div class="row" style="margin-top:8px">
        <div class="field"><label for="haUrl">Adres</label><input id="haUrl" placeholder="http://192.168.1.10:8123" value="${esc(W.ha.url)}" autocomplete="off"></div>

        <div class="field" style="flex:0 0 auto"><button class="btn ghost" id="haBtn">Koppelen</button></div>
      </div><p class="small muted" id="haMsg" role="status"></p></details>`;
  }
  el.innerHTML = html;
  if ($("haBox")) $("haBox").ontoggle = () => { W.ha.open = $("haBox").open; };
  if ($("haBtn")) $("haBtn").onclick = connectHA;
  el.querySelectorAll(".dev:not(.bad)").forEach((d) => {
    const toggle = () => {
      const key = d.dataset.key, kind = d.dataset.kind;
      if (kind === "meter") { const f = FOUND.find((x) => "f:" + x.host === key); W.meter = { type: f.kind, host: f.host, f }; }
      else if (kind === "hameter") { const p = cands.power_sensors.find((x) => "m:" + x.entity === key); W.meter = { type: "ha", entity: p.entity, export_entity: p.export_entity || "", name: p.name }; }
      else if (W.picks.some((p) => p.key === key)) W.picks = W.picks.filter((p) => p.key !== key);
      else if (kind === "found") W.picks.push({ key, source: "found", f: FOUND.find((x) => "f:" + x.host === key) });
      else W.picks.push({ key, source: "ha", c: cands.devices.find((c) => "h:" + (c.entity || c.current_entity || c.button_entity) === key) });
      renderFound();
    };
    d.onclick = toggle; d.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });

    if (r.found) { r.found._manual = true; FOUND = FOUND.filter((f) => f.host !== r.found.host).concat(r.found); renderFound(); if (r.found.ok) toast("Gelukt, nu bruikbaar"); }

  if ($("next")) $("next").disabled = !ready;
}

function meterSpec(m, invert) {
  if (m.type === "ha" && m.export_entity) return { meter: { driver: "ha", import_entity: m.entity, export_entity: m.export_entity, invert } };
  if (m.type === "ha") return { meter: { driver: "ha", entity: m.entity, invert } };
  if (m.type === "p1_serial") return { host: "", meter: { driver: "p1_serial", port: m.host, invert } };
  return { host: m.host, meter: { driver: m.type === "shelly_em" ? "shelly_em" : "homewizard", host: m.host, invert } };
}
function meter() {
  const m = W.meter;

    <div class="eyebrow">Stap 3</div>
    <h1 class="t">Je meter uitlezen</h1>
    <p class="lead">Zonnestuur leest nu live mee met ${m.type === "ha" ? esc(m.name) : esc(m.f.name)}.</p>
    <div class="live"><span class="pulse" id="pulse"></span><div><div class="big t" id="p1w">–</div><div class="small muted" id="p1t">verbinden…</div></div></div>

    <div class="actions"><button class="btn ghost" id="back">← Terug</button><button class="btn" id="next" disabled>Klopt, verder →</button></div>

  $("back").onclick = () => go(1);
  $("next").onclick = () => go(3);
  if ($("inv")) $("inv").onchange = () => { W.invert = $("inv").checked; poll(); };
  const poll = async () => {
    try {
      const r = await api("api/setup/meter", { method: "POST", body: JSON.stringify(meterSpec(m, W.invert)) });
      if (r.ok) {
        $("p1w").textContent = (r.grid_w < 0 ? "−" : "") + nl(Math.abs(r.grid_w) / 1000, 2) + " kW";
        $("p1t").textContent = r.grid_w < 0 ? "je levert nu terug" : "je haalt nu stroom van het net";
        $("pulse").classList.remove("off"); $("next").disabled = false; setErr("");
      } else { $("pulse").classList.add("off"); $("p1t").textContent = "geen gegevens"; setErr(r.problem_text); }
    } catch (e) { setErr(e.message); }
  };

// ---------- stap 4: apparaten ----------
let devIdx = 0;
function deviceFromPick(p) {
  if (p.source === "found") {
    return { key: p.key, host: p.f.host, driver: p.f.driver || "shelly", switch_id: 0, params: {}, kind: "boiler", name: "Boiler",
      power_w: 2000, tested: null, model: `${p.f.name} op ${p.f.host}` };
  }
  const c = p.c, params = {};
  for (const k of ["entity", "current_entity", "switch_entity", "power_entity", "normal_temp", "boost_temp", "min_a", "max_a", "button_entity", "remote_entity", "min_interval_s", "plug_entity"]) if (c[k] !== undefined && c[k] !== "") params[k] = c[k];
  if (c.driver === "ha_current") params.phases = 3;
  const power = c.power_w || (c.driver === "ha_current" ? 11000 : c.kind === "heatpump" ? 1500 : 2000);
  return { key: p.key, host: "", driver: c.driver, switch_id: 0, params, kind: c.kind, name: c.name, power_w: power, tested: null,
    model: `Koppelmotor · ${c.entity || c.current_entity || c.button_entity}` };
}
function evRange(d) { const w = 230 * (d.params.phases || 1); return [d.params.min_a * w, d.params.max_a * w]; }
function apparaten() {

  devIdx = Math.min(devIdx, W.devices.length - 1);

  let extra = "";

      <div class="field"><label for="tnorm">Normale temperatuur (°C)</label><input id="tnorm" type="number" step="0.5" value="${P.normal_temp}"></div>
      <div class="field"><label for="tboost">Temperatuur bij zon (°C)</label><input id="tboost" type="number" step="0.5" value="${P.boost_temp}"><span class="hint">Bij zon zetten we hem hoger, zodat hij de warmte opslaat in water of huis.</span></div></div>`;
  if (drv === "ha_current") {
    const [lo, hi] = evRange(d);
    extra = `<div class="row">
      <div class="field"><label for="phases">Aansluiting</label><select id="phases"><option value="1" ${P.phases == 1 ? "selected" : ""}>1 fase</option><option value="3" ${P.phases == 3 ? "selected" : ""}>3 fasen</option></select></div>
      <div class="field"><label for="mina">Minimaal (A)</label><input id="mina" type="number" min="6" max="32" value="${P.min_a}"></div>
      <div class="field"><label for="maxa">Maximaal (A)</label><input id="maxa" type="number" min="6" max="32" value="${P.max_a}"></div></div>
      <p class="small muted">Zonnestuur regelt de laadstroom traploos tussen <b>${nl(lo / 1000, 1)}</b> en <b>${nl(hi / 1000, 1)} kW</b>, precies op wat je overhoudt.${(P.min_interval_s || 0) > 60 ? ` Deze laadpaal passen we hooguit eens per ${Math.round(P.min_interval_s / 60)} minuten aan (advies van de fabrikant), met wat je dat hele kwartier minstens overhield.` : ""}</p>`;
  }

    <p class="small muted" style="margin-top:-4px">${drv === "ha_start_button" ? "We starten geen programma om te testen. We kijken alleen of hij bereikbaar is." : drv === "ha_setpoint" ? "We zetten de temperatuur een paar seconden hoger en daarna terug." : drv === "ha_current" ? "We starten het laden een paar seconden op de laagste stroom." : "We zetten hem een paar seconden aan en meten wat het apparaat opneemt."}</p>
    <div class="test" id="testBox">${testHtml(d)}</div>
    ${drv === "ha_start_button" ? `<p class="small muted">Zo gebruik je hem: vul de machine, kies het programma en zet hem op <b>Start op afstand</b> (MobileStart). Zonnestuur drukt op start zodra er genoeg zon is. Een gestart programma zet Zonnestuur nooit stop.</p>` : ""}
    ${drv === "ha_current" ? "" : `<div class="row"><div class="field" style="flex:0 1 220px"><label for="dpower">Vermogen (watt)</label><input id="dpower" type="number" min="100" max="25000" step="50" value="${d.power_w}"><span class="hint">${drv === "ha_setpoint" || drv === "ha_start_button" ? "Wat hij ongeveer gemiddeld opneemt als hij draait." : "Staat ook op het typeplaatje."}</span></div></div>`}

    if ($("phases")) {
      P.phases = Number($("phases").value); P.min_a = Math.max(6, Number($("mina").value) || 6); P.max_a = Math.max(P.min_a, Math.min(32, Number($("maxa").value) || 16));

  $("next").onclick = () => { save(); if (devIdx < W.devices.length - 1) { devIdx++; apparaten(); } else if (W.addOnly) saveAll(); else go(4); };
}
function testHtml(d) {

function readContract(c) {
  if ($("cp_ip")) { c.import_price = Number($("cp_ip").value) || 0.29; c.feed_in_price = Number($("cp_fp").value) || 0; c.return_cost = Number($("cp_rc").value) || 0; }
  if ($("cp_sm")) { c.supplier_markup = Number($("cp_sm").value) || 0; c.feed_in_adjust = Number($("cp_fa").value); c.energy_tax = $("cp_et").value === "" ? null : Number($("cp_et").value); }
  if ($("cp_pe")) c.price_entity = $("cp_pe").value;
  if ($("cp_rm")) {
    const n = (x) => Number(String(x).trim().replace(",", "."));
    c.return_cost_mode = $("cp_rm").value;
    c.return_cost_tiers = $("cp_rt").value.split(";").map((x) => x.split(":")).filter((x) => x.length === 2 && !isNaN(n(x[0])) && !isNaN(n(x[1]))).map(([a, b]) => [n(a), n(b)]);
    c.export_kwh_year = Number($("cp_ey").value) || 0;
    c.grid_tou = $("cp_tou").value.split(";").map((x) => x.trim().match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})\s+([\d.,]+)$/)).filter(Boolean)
      .map((m) => ({ from: m[1].padStart(5, "0"), to: m[2].padStart(5, "0"), eur_kwh: n(m[3]) }));

function bindContract(c, rerender) {

function buildDevice(d, taken) {
  let id = slug(d.name); let n = 2; const base = id;
  while (taken.has(id)) id = base + "-" + n++;
  taken.add(id);
  const k = KIND_DEFAULTS[d.kind];
  return Object.assign({ id, name: d.name, host: d.host || "", driver: d.driver || "shelly", params: d.params || {},
    switch_id: d.switch_id || 0, kind: d.kind, power_w: d.power_w, priority: 1 },
    k, { ready_times: k.ready_times.length ? (d.ready_times || k.ready_times) : [] });
}
async function postCfg(next) {
  delete next.homeassistant;            // de koppelmotor wordt apart gekoppeld (token blijft op het kastje)
  delete next.has_ha;
  return api("api/config", { method: "POST", body: JSON.stringify(next) });
}
async function saveAll() {
  setErr("");
  const next = JSON.parse(JSON.stringify(CFG));
  const taken = new Set((next.devices || []).map((d) => d.id));
  const newDevs = W.devices.map((d) => buildDevice(d, taken));
  if (W.addOnly) {
    next.devices = (next.devices || []).concat(newDevs.map((d, i) => ({ ...d, priority: (next.devices || []).length + i + 1 })));
  } else {
    const m = W.meter;
    next.p1_host = m && m.type !== "ha" ? m.host : "";
    next.meter = m ? meterSpec(m, W.invert).meter : {};
    next.devices = newDevs.map((d, i) => ({ ...d, priority: i + 1 }));
    next.contract = Object.assign({}, next.contract || {}, W.contract);
    const [lat, lon] = REGIONS[W.solar.region];
    next.solar = Object.assign({}, next.solar || {}, { kwp: W.solar.kwp, azimuth: ORIENT[W.solar.orient], latitude: lat, longitude: lon,
      tilt: W.solar.orient === "Oost-west" ? 15 : 35, has_panels: !W.noPanels });
  }
  try {
    CFG = await postCfg(next);
    go(5);
  } catch (e) { setErr(e.message); }
}

function bindInverter() {
  if (!$("i_link")) return;
  const upd = () => {
    const t = $("i_link").value, f = INV_FIELDS[t];
    $("i_ha").hidden = t !== "ha"; $("i_direct").hidden = !f;
    if (!f) return;
    document.querySelectorAll("[data-it]").forEach((x) => {
      const k = x.dataset.it;
      x.hidden = (k === "port" && !f[0]) || (k === "unit" && !f[1]) || (k === "pw" && !f[2]) || (k === "max" && !f[3]);
    });
    $("i_dport").placeholder = f[0]; $("i_dunit").placeholder = f[1]; $("i_dpwl").textContent = f[2] || "Wachtwoord";
    $("i_dhelp").textContent = INV_HELP[t] || "";
  };
  $("i_link").onchange = () => { $("i_res").textContent = ""; upd(); }; upd();
  $("i_test").onclick = async () => {
    $("i_res").textContent = "Bezig…";
    try {
      const r = await api("api/setup/inverter-test", { method: "POST", body: JSON.stringify(readInverterDirect()) });
      if (!r.ok) { $("i_res").textContent = r.error || "Niet gelukt"; return; }
      const parts = [`Verbonden ✓ Opwek nu ${Math.round(r.pv_w || 0)} W`];
      if (r.day_kwh != null) parts.push(`vandaag ${r.day_kwh.toFixed(1)} kWh`);
      if (r.soc != null) parts.push(`batterij ${Math.round(r.soc)}%`);
      if (r.max_w) parts.push(`vol vermogen ${Math.round(r.max_w)} W`);
      $("i_res").textContent = parts.join(", ") + (r.can_limit ? "." : r.note ? ". " + r.note : ". Begrenzen kan bij deze koppeling niet.");
    } catch (e) { $("i_res").textContent = "Niet gelukt: " + e.message; }
  };
}
function readInverterDirect() {
  const v = (id) => $(id).value.trim();
  const o = { direct_type: v("i_link"), host: v("i_dhost"), password: v("i_dpw") };
  if (v("i_dport")) o.port = Number(v("i_dport"));
  if (v("i_dunit") !== "") o.unit_id = Number(v("i_dunit"));
  if (v("i_dmax")) o.max_w = Number(v("i_dmax"));
  return o;
}
function readInverter() {
  if (!$("i_link")) return CFG.inverter || {};
  const t = $("i_link").value;
  if (t === "ha") { const ent = $("i_ent").value.trim(); return ent ? { entity: ent, max_w: Number($("i_max").value) || 0, unit: $("i_unit").value } : {}; }
  if (INV_FIELDS[t]) return readInverterDirect();
  return {};
}

  ["huis", "Je huis", ["Apparaten", "Thuisbatterij", "Zonnepanelen", "Omvormer", "Meter", "Meekijken bij slim laden"]],

function groepeer() {
  const root = document.querySelector(".settings"); if (!root) return;
  const secs = [...root.querySelectorAll(":scope > section")];
  const welke = (sec) => {
    if (sec.id === "editCard") return "huis";
    const t = ((sec.querySelector("h2") || {}).textContent || "").trim();
    const g = GROEPEN.find(([, , ts]) => ts.some((x) => t.startsWith(x)));
    return g ? g[0] : "koppelingen";
  };
  secs.forEach((x) => { x.dataset.groep = welke(x); });
  const kop = root.firstElementChild, save = root.querySelector(":scope > .actions");
  const nav = document.createElement("nav"); nav.className = "inst-nav"; nav.setAttribute("aria-label", "Onderdelen van de instellingen");
  nav.innerHTML = GROEPEN.map(([id, t]) => `<button type="button" data-g="${id}">${t}</button>`).join("");
  const inh = document.createElement("div"); inh.className = "inst-inhoud";
  secs.forEach((x) => inh.appendChild(x));
  if (save) { save.classList.add("savebar"); inh.appendChild(save); }
  root.classList.add("met-nav"); document.body.classList.add("breed");
  kop.after(nav); nav.after(inh);
  const toon = (g, scroll) => {
    secs.forEach((x) => x.classList.toggle("weg", x.dataset.groep !== g));
    nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.g === g));
    const act = nav.querySelector("button.on"); if (act && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = act.offsetLeft - 16;
    if (save) save.classList.toggle("weg", !secs.some((x) => x.dataset.groep === g && !x.hidden && x.querySelector("input,select,textarea")));
    try { sessionStorage.setItem("zs_inst", g); } catch (e) {}
    if (scroll) window.scrollTo({ top: 0 });
  };
  nav.onclick = (e) => { const b = e.target.closest("button[data-g]"); if (b) toon(b.dataset.g, true); };
  let start = "huis";
  try { start = sessionStorage.getItem("zs_inst") || start; } catch (e) {}
  const doel = location.hash && document.querySelector(location.hash);
  if (doel && doel.dataset && doel.dataset.groep) start = doel.dataset.groep;
  else if (doel && doel.closest && doel.closest("section[data-groep]")) start = doel.closest("section[data-groep]").dataset.groep;
  toon(start, false);
  window.toonGroep = (g) => toon(g, false);
  window.onhashchange = () => { const d = location.hash && document.querySelector(location.hash); const sec = d && d.closest && d.closest("section[data-groep]");
    if (sec) { toon(sec.dataset.groep, false); d.scrollIntoView({ block: "start" }); } };
}

        const cur = CFG.notify?.service || "";
        $("n_svc").innerHTML = `<option value="">Geen meldingen</option>` + [...new Set([...(r.notify_services || []), ...(cur ? [cur] : [])])]
          .map((v) => `<option ${v === cur ? "selected" : ""} value="${esc(v)}">${esc(v.replace("notify.mobile_app_", "📱 ").replace("notify.", ""))}</option>`).join("");
      } catch (e) {}
    })();
  }
  const readNotify = () => {
    const g = (id) => ($(id) ? $(id).value.trim() : "");
    const n = { tips: $("n_tips").checked, alerts: $("n_alerts").checked, reports: $("n_rep").checked, appliances: $("n_appl").checked, link: g("n_link") };
    if (g("n_svc")) n.service = g("n_svc");
    if (g("n_ntfy")) n.ntfy = { topic: g("n_ntfy"), server: g("n_ntfys") || "https://ntfy.sh" };
    if (g("n_tgc")) n.telegram = { chat_id: g("n_tgc"), token: g("n_tgt") };
    if (g("n_eh")) n.email = { host: g("n_eh"), port: Number(g("n_ep")) || 587, user: g("n_eu"), password: $("n_ew").value, to: g("n_et") };
    return n;
  };
  $("n_test").onclick = async () => {
    $("n_res").textContent = "Versturen…";
    const r = await api("api/notify/test", { method: "POST", body: JSON.stringify({ notify: readNotify() }) });
    $("n_res").textContent = r.ok ? `Verstuurd via ${r.sent.join(", ")}. Kijk op je telefoon of in je mail.` : r.error;
  };
  document.querySelectorAll("#t_devs button").forEach((b) => b.onclick = () => b.classList.toggle("on"));
  $("tokBtn").onclick = async () => {
    try {
      const v = $("s_tok").value;
      CFG = await api("api/config", { method: "POST", body: JSON.stringify({ new_token: v }) });   // alleen het wachtwoord
      token = v; try { localStorage.setItem("zs_token", v); } catch (e) {}
      toast(v ? "Wachtwoord ingesteld" : "Wachtwoord uitgezet"); settings();
    } catch (e) { setErr(e.message); }
  };
  $("saveBtn").onclick = async () => {
    const next = JSON.parse(JSON.stringify(CFG));
    readContract(c);
    next.contract = Object.assign({}, next.contract, c);
    const [lat, lon] = REGIONS[$("s_rg").value];
    Object.assign(next.solar, { kwp: Number($("s_kwp").value), azimuth: ORIENT[$("s_or").value], latitude: lat, longitude: lon,
      base_load_w: Number($("s_base").value), pv_entity: $("s_pv") ? $("s_pv").value.trim() : (next.solar.pv_entity || ""), tilt: $("s_or").value === "Oost-west" ? 15 : 35, has_panels: $("s_haspan").checked });
    Object.assign(next, meterFromForm());
    next.mqtt = $("q_host").value.trim() ? mqttConf() : {};
    next.homey = $("h_url").value.trim() ? { url: $("h_url").value.trim(), token: $("h_tok").value.trim() } : {};
    Object.keys(SYSX).forEach((k) => { next[k] = $(k + "_url").value.trim() ? sysConf(k) : {}; });
    next.ocpp = { enabled: $("o_on").checked, port: Number($("o_port").value) || 8887 };
    next.batteries = readBattery(B);
    if ($("w_on")) next.waarnemen = $("w_on").checked && $("w_pe").value.trim() ? [Object.assign({}, (CFG.waarnemen || [])[0] || {}, {
      id: ((CFG.waarnemen || [])[0] || {}).id || "auto", naam: "Auto", power_entity: $("w_pe").value.trim(), leverancier: $("w_lev").value.trim(),
      klaar: $("w_kl").value || "07:30", max_kw: Number($("w_kw").value) || 11, vergoeding_kwh: Number($("w_vg").value) || 0, vergoeding_entity: $("w_ve") ? $("w_ve").value.trim() : "" })] : [];
    next.inverter = readInverter();
    next.notify = readNotify();
    next.motivation = $("g_mot").value;
    next.profile = $("g_prof").value;
    if ($("s_fuse")) { const [ph, a] = $("s_fuse").value.split("x").map(Number); next.fuse_a = a || 0; next.fuse_phases = ph || 3; }
    next.goal = { type: $("g_type").value, extra_pp: Number($("g_pp").value) || 10, eur_month: Number($("g_eur").value) || 25 };
    const tdev = [...document.querySelectorAll("#t_devs button.on")].map((b) => b.dataset.id);
    next.trial = { enabled: $("t_on").checked, every: Number($("t_every").value) || 7, devices: tdev.length === CFG.devices.length ? [] : tdev };
    if ($("k_ha")) next.kiosk = { ha_sensors: $("k_ha").checked };
    try { CFG = await postCfg(next); toast("Opgeslagen"); setErr(""); }
    catch (e) { setErr(e.message); }
  };
}
const DAYL = ["ma", "di", "wo", "do", "vr", "za", "zo"];
async function editDevice(i) {
  const d = CFG.devices[i], box = $("editCard"), P = d.params || {};
  let learned = null;
  try { learned = ((await api("api/learned")).devices || []).find((x) => x.id === d.id) || null; } catch (e) {}

  const times = d.ready_times && d.ready_times.length ? d.ready_times : [];
  const oneShot = d.driver === "ha_start_button";
  const learnTxt = learned && learned.learned_min != null ? `Geleerd: gemiddeld ${Math.round(learned.learned_min)} min per dag (${String(learned.kwh).replace(".", ",")} kWh, ${learned.days} dagen).`
    : "Nog aan het leren: na 4 dagen met verbruik weet Zonnestuur hoe lang dit apparaat echt nodig heeft.";
  box.hidden = false;
  box.innerHTML = `<h2 class="t">${esc(d.name)} aanpassen</h2>
    <h3 class="sub-t">Algemeen</h3>
    <div class="row">
      <div class="field"><label for="e_name">Naam</label><input id="e_name" value="${esc(d.name)}" maxlength="40"></div>
      <div class="field"><label for="e_kind">Soort</label><select id="e_kind">${KINDS.map((k) => `<option value="${k.id}" ${k.id === d.kind ? "selected" : ""}>${k.label}</option>`).join("")}</select></div>
    </div>
    <div class="row">
      <div class="field" ${d.driver === "ha_current" ? "hidden" : ""}><label for="e_power">Vermogen als hij aan staat (W)</label><input id="e_power" type="number" step="50" value="${d.power_w}"></div>
      <div class="field"><label for="e_prio">Prioriteit</label><input id="e_prio" type="number" min="1" max="20" value="${d.priority}"><span class="hint">1 krijgt als eerste de zon.</span></div>
      <div class="field" style="flex:0 1 200px"><label for="e_nb">Nooit vóór</label><input id="e_nb" type="time" value="${esc(P.not_before || "")}"><span class="hint">Bijv. niet vóór 08:00 (geluid). Leeg = altijd.</span></div>
    </div>
    ${d.driver === "ha_setpoint" ? `<div class="row">
      <div class="field"><label for="e_tn">Normale temperatuur (°C)</label><input id="e_tn" type="number" step="0.5" value="${P.normal_temp}"></div>
      <div class="field"><label for="e_tb">Temperatuur bij zon of goedkope stroom (°C)</label><input id="e_tb" type="number" step="0.5" value="${P.boost_temp}"></div></div>
    <div class="row">
      <div class="field"><label for="e_blk">Niet opwarmen zolang deze aan staat</label><input id="e_blk" value="${esc((P.block_entities || []).join(", "))}" placeholder="bijv. input_boolean.ontvochtigen"><span class="hint">Eén of meer schakelaars uit de koppelmotor, met komma's.</span></div>
      <div class="field"><label for="e_night">Alleen 's nachts (22–06) zolang deze aan staat</label><input id="e_night" value="${esc(P.night_only_entity || "")}" placeholder="bijv. input_boolean.koelseizoen"></div>
    </div><div class="row">
      <div class="field"><label for="e_eco">Lager tijdens dure stroom (°C)</label><input id="e_eco" type="number" step="0.5" min="0" max="15" value="${P.eco_delta || 0}"><span class="hint">Bijv. 1: in de duurste uren van de dag staat hij zoveel lager. 0 = uit.</span></div>
      <div class="field"><label class="check"><input type="checkbox" id="e_leg" ${P.legionella ? "checked" : ""}> Wekelijks heet (legionella)</label>
        <input id="e_legt" type="number" step="1" min="55" max="70" value="${P.legionella_temp || 60}" aria-label="Temperatuur legionellaronde"><span class="hint">Eén keer per week naar deze temperatuur, op het zonnigste of goedkoopste uur. Doet je warmtepomp dit zelf? Laat het uit.</span></div></div>` : ""}
    ${d.driver === "ha_current" ? `<div class="row">
      <div class="field"><label for="e_ph">Fasen</label><select id="e_ph"><option ${P.phases == 1 ? "selected" : ""}>1</option><option ${P.phases == 3 ? "selected" : ""}>3</option></select></div>
      <div class="field"><label for="e_mina">Minimaal (A)</label><input id="e_mina" type="number" min="6" max="32" value="${P.min_a}"></div>
      <div class="field"><label for="e_maxa">Maximaal (A)</label><input id="e_maxa" type="number" min="6" max="32" value="${P.max_a}"></div>
      <div class="field"><label for="e_int">Niet vaker bijsturen dan (min)</label><input id="e_int" type="number" min="0" max="60" value="${Math.round((P.min_interval_s || 0) / 60)}"></div></div>
    ${d.kind === "ev" ? `<div class="row">
      <div class="field"><label for="e_ss">Minimaal aandeel zon (%)</label><input id="e_ss" type="number" min="0" max="100" step="10" value="${P.solar_share ?? 100}"><span class="hint">100 = alleen op zon. 50 = mag ook laden als de helft uit het net komt (start eerder bij wisselend weer).</span></div>
      <div class="field"><label for="e_pse">Fasewissel (optioneel)</label><input id="e_pse" value="${esc(P.phase_switch_entity || "")}" placeholder="bijv. select.laadpaal_fasen"><span class="hint">Bij weinig zon laadt hij op 1 fase (vanaf ± 1,4 kW), bij veel zon op 3.</span></div>
      <div class="field"><label for="e_p1">Optie voor 1 fase</label><input id="e_p1" value="${esc(P.phase_1 || "")}" placeholder="bijv. 1"></div>
      <div class="field"><label for="e_p3">Optie voor 3 fasen</label><input id="e_p3" value="${esc(P.phase_3 || "")}" placeholder="bijv. 3"></div></div>` : ""}` : ""}

    ${oneShot ? "" : `<h3 class="sub-t">${d.kind === "ev" ? "Vertrektijd" : "Klaar om"}</h3>
    <p class="hint" style="margin:-4px 0 8px">Op deze tijd moet ${d.kind === "ev" ? "de auto geladen" : d.kind === "boiler" ? "het water warm" : "het apparaat klaar"} zijn. Lukt dat niet met zon of goedkope uren, dan haalt Zonnestuur het laatste stuk van het net.</p>
    <div id="e_times">${(times.length ? times : [""]).map((t) => `<div class="row time-row"><div class="field" style="flex:0 1 160px"><input type="time" class="e_t" value="${esc(t)}" aria-label="Tijd"></div><button type="button" class="btn ghost small e_rm" aria-label="Tijd weghalen">✕</button></div>`).join("")}</div>
    <button type="button" class="btn ghost small" id="e_addt" style="margin:4px 0 10px">+ Nog een tijd</button>
    <div class="days" id="e_days" role="group" aria-label="Op welke dagen">${DAYL.map((l, k) => `<button type="button" data-d="${k}" class="${days.includes(k) ? "on" : ""}" aria-pressed="${days.includes(k)}">${l}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="e_g">Zoveel minuten ervoor mag hij van het net bijladen</label><input id="e_g" type="number" min="0" step="15" value="${d.guarantee_min}"><span class="hint">0 = geen garantie, alleen zon en goedkope uren.</span></div>
      <div class="field"><label for="e_look">Telt als klaar als hij binnen zoveel uur ervoor vol was</label><input id="e_look" type="number" min="1" max="24" step="0.5" value="${d.full_lookback_h}"></div>
    </div>`}

    ${d.driver === "shelly" ? `<h3 class="sub-t">Vangnet</h3>
    <label class="check-row"><input type="checkbox" id="e_fs" ${(P.failsafe ?? d.kind === "boiler") ? "checked" : ""}> Doet de Box het niet, dan zet de Shelly ${esc(d.name)} zelf aan</label>
    <div class="row" style="margin-top:8px"><div class="field" style="flex:0 1 260px"><label for="e_fsw">Elke dag tussen</label>
      <select id="e_fsw">${["10-13", "11-14", "12-15", "13-16", "11-15"].map((w) => `<option value="${w}" ${(P.failsafe_window || "12-15") === w ? "selected" : ""}>${w.replace("-", ":00 en ")}:00 uur</option>`).join("")}</select>
      <span class="hint">Er komt een klein script op de Shelly. Hoort hij 3 uur niets van de Box, dan verwarmt hij zelf in dit venster. Zo is er altijd warm water.</span></div></div>` : ""}

    <h3 class="sub-t">Hoe lang per dag</h3>
    <label class="check-row"><input type="checkbox" id="e_learn" ${d.learn_run === false ? "" : "checked"}> Zelf leren uit wat ${esc(d.name)} echt gebruikt <span class="muted">(aanbevolen)</span></label>
    <p class="hint" style="margin:6px 0 8px">${esc(learnTxt)}</p>
    <div class="row"><div class="field" style="flex:0 1 260px"><label for="e_run">${d.learn_run === false ? "Looptijd per dag (min)" : "Tot er genoeg geleerd is (min per dag)"}</label><input id="e_run" type="number" min="0" step="15" value="${d.expected_run_min}"></div></div>

    <details><summary>Geavanceerd: reageren op zon</summary><div class="row" style="margin-top:12px">
      <div class="field"><label for="e_start">Aan bij overschot van (W)</label><input id="e_start" type="number" step="50" value="${d.start_surplus_w ?? ""}" placeholder="automatisch (90% van vermogen)"></div>
      <div class="field"><label for="e_sd">…gedurende (s)</label><input id="e_sd" type="number" step="10" value="${d.start_delay_s}"></div>
      <div class="field"><label for="e_stop">Uit bij afname van meer dan (W)</label><input id="e_stop" type="number" step="50" value="${d.stop_import_w}"></div>
      <div class="field"><label for="e_xd">…gedurende (s)</label><input id="e_xd" type="number" step="10" value="${d.stop_delay_s}"></div>
    </div><div class="row">
      <div class="field"><label for="e_minon">Minimaal aan (min)</label><input id="e_minon" type="number" min="0" value="${Math.round(d.min_on_s / 60)}"></div>
      <div class="field"><label for="e_minoff">Minimaal uit (min)</label><input id="e_minoff" type="number" min="0" value="${Math.round(d.min_off_s / 60)}"></div>
    </div>
    <label class="check-row"><input type="checkbox" id="e_full" ${d.detect_full === false ? "" : "checked"}> Herken 'vol': staat aan maar neemt geen stroom meer op (thermostaat klaar, auto vol)</label>
    </details>
    <div class="actions"><button class="btn danger small" id="e_del">Verwijderen</button>
      <div class="row"><button class="btn ghost small" id="e_cancel">Annuleren</button><button class="btn small" id="e_save">Opslaan</button></div></div>`;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  const bindRm = () => box.querySelectorAll(".e_rm").forEach((b) => b.onclick = () => { const rows = box.querySelectorAll(".time-row"); if (rows.length > 1) b.closest(".time-row").remove(); else rows[0].querySelector("input").value = ""; });
  bindRm();
  if ($("e_addt")) $("e_addt").onclick = () => { $("e_times").insertAdjacentHTML("beforeend", `<div class="row time-row"><div class="field" style="flex:0 1 160px"><input type="time" class="e_t" aria-label="Tijd"></div><button type="button" class="btn ghost small e_rm" aria-label="Tijd weghalen">✕</button></div>`); bindRm(); };
  box.querySelectorAll("#e_days button").forEach((b) => b.onclick = () => { b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); });
  $("e_cancel").onclick = () => { box.hidden = true; };
  let confirmDel = false;
  $("e_del").onclick = async () => {
    if (!confirmDel) { confirmDel = true; $("e_del").textContent = "Echt verwijderen?"; return; }
    const next = JSON.parse(JSON.stringify(CFG)); next.devices.splice(i, 1);
    try { CFG = await postCfg(next); toast("Verwijderd"); settings(); } catch (e) { setErr(e.message); }
  };
  $("e_save").onclick = async () => {
    const next = JSON.parse(JSON.stringify(CFG)), n = next.devices[i];
    const num = (id, dflt) => { const v = Number($(id).value); return $(id).value === "" || isNaN(v) ? dflt : v; };
    n.name = $("e_name").value.trim() || n.name; n.kind = $("e_kind").value; n.power_w = num("e_power", n.power_w);
    n.priority = num("e_prio", 1) || 1;
    if (!oneShot) {
      n.ready_times = [...new Set([...box.querySelectorAll(".e_t")].map((x) => x.value).filter(Boolean))].sort();
      const dd = [...box.querySelectorAll("#e_days button.on")].map((b) => Number(b.dataset.d));
      if (!dd.length) { setErr("Kies minstens één dag, of haal de tijd weg."); return; }
      n.ready_days = dd.length === 7 ? [] : dd;
      n.guarantee_min = Math.max(0, num("e_g", 0)); n.full_lookback_h = Math.max(1, num("e_look", 4));
    }

    n.start_surplus_w = $("e_start").value === "" ? null : num("e_start", null); n.start_delay_s = Math.max(0, num("e_sd", 60));
    n.stop_import_w = num("e_stop", 300); n.stop_delay_s = Math.max(0, num("e_xd", 120));
    n.min_on_s = Math.max(0, num("e_minon", 10)) * 60; n.min_off_s = Math.max(0, num("e_minoff", 5)) * 60; n.detect_full = $("e_full").checked;
    n.params = n.params || {};
    if ($("e_nb").value) n.params.not_before = $("e_nb").value; else delete n.params.not_before;
    if ($("e_fs")) { n.params = n.params || {}; n.params.failsafe = $("e_fs").checked; n.params.failsafe_window = $("e_fsw").value; }
    if ($("e_tn")) { n.params.normal_temp = num("e_tn", n.params.normal_temp); n.params.boost_temp = num("e_tb", n.params.boost_temp); }
    if ($("e_blk")) { const b = $("e_blk").value.split(",").map((x) => x.trim()).filter(Boolean); if (b.length) n.params.block_entities = b; else delete n.params.block_entities;
      const ne = $("e_night").value.trim(); if (ne) n.params.night_only_entity = ne; else delete n.params.night_only_entity; }
    if ($("e_eco")) { n.params.eco_delta = Math.max(0, Math.min(15, num("e_eco", 0))); n.params.legionella = $("e_leg").checked; n.params.legionella_temp = num("e_legt", 60); }
    if ($("e_ss")) { n.params.solar_share = Math.max(0, Math.min(100, num("e_ss", 100)));
      for (const [id, k] of [["e_pse", "phase_switch_entity"], ["e_p1", "phase_1"], ["e_p3", "phase_3"]]) { const v = $(id).value.trim(); if (v) n.params[k] = v; else delete n.params[k]; } }
    if ($("e_ph")) {
      Object.assign(n.params, { phases: Number($("e_ph").value), min_a: Math.max(6, num("e_mina", 6)), max_a: Math.min(32, num("e_maxa", 16)),
        min_interval_s: Math.max(0, num("e_int", 0)) * 60 });
      n.power_w = Math.min(25000, n.params.max_a * 230 * n.params.phases);
    }
    try { CFG = await postCfg(next); toast("Opgeslagen"); setErr(""); settings(); } catch (e) { setErr(e.message); }
  };
}

// ---------- start ----------
(async () => {
  try {
    CFG = await api("api/config");
    if (CFG.solar) { W.solar.kwp = CFG.solar.kwp; W.solar.region = nearestRegion(CFG.solar.latitude, CFG.solar.longitude); W.noPanels = CFG.solar.has_panels === false; }
    if (CFG.contract) Object.assign(W.contract, CFG.contract);
    if (CFG.has_ha) W.ha.url = CFG.homeassistant?.url || "";
    if (MODE === "settings") {
      if (!CFG.configured) { location.href = "setup"; return; }
      document.title = "Zonnestuur · instellingen"; settings();
    } else {
      if (W.addOnly && !CFG.configured) W.addOnly = false;
      go(0);
    }
  } catch (e) { setErr("Kan Zonnestuur niet bereiken. " + e.message); }
})();
