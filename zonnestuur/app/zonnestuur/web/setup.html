<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zonnestuur instellen</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Inter Tight"; src: url("fonts/inter-tight.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: light;
    --bg: #f3f2ec; --glow-1: rgba(255,178,36,.16); --glow-2: rgba(47,91,219,.10);
    --card: rgba(255,255,255,.82); --card-solid: #fff; --line: rgba(14,17,22,.08);
    --shadow: 0 1px 2px rgba(14,17,22,.04), 0 8px 28px -12px rgba(14,17,22,.12);
    --ink: #0e1116; --ink-2: #5c6470; --ink-3: #8a919b; --field: #fff;
    --sun: #e08600; --sun-ink: #9a5b00; --sun-soft: rgba(255,178,36,.16); --net: #2f5bdb;
    --good: #1f8a4c; --good-soft: rgba(31,138,76,.12); --warn: #b54708; --warn-soft: rgba(181,71,8,.10);
    --chip: rgba(14,17,22,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #07090c; --glow-1: rgba(255,178,36,.13); --glow-2: rgba(91,140,255,.12);
      --card: rgba(255,255,255,.045); --card-solid: #11151b; --line: rgba(255,255,255,.09);
      --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -30px rgba(0,0,0,.8);
      --ink: #f2f4f7; --ink-2: #a3acb8; --ink-3: #6f7885; --field: rgba(255,255,255,.04);
      --sun: #ffb224; --sun-ink: #ffb224; --sun-soft: rgba(255,178,36,.14); --net: #5b8cff;
      --good: #4ade80; --good-soft: rgba(74,222,128,.12); --warn: #fdb022; --warn-soft: rgba(253,176,34,.12);
      --chip: rgba(255,255,255,.06);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #07090c; --glow-1: rgba(255,178,36,.13); --glow-2: rgba(91,140,255,.12);
    --card: rgba(255,255,255,.045); --card-solid: #11151b; --line: rgba(255,255,255,.09);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -30px rgba(0,0,0,.8);
    --ink: #f2f4f7; --ink-2: #a3acb8; --ink-3: #6f7885; --field: rgba(255,255,255,.04);
    --sun: #ffb224; --sun-ink: #ffb224; --sun-soft: rgba(255,178,36,.14); --net: #5b8cff;
    --good: #4ade80; --good-soft: rgba(74,222,128,.12); --warn: #fdb022; --warn-soft: rgba(253,176,34,.12);
    --chip: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 15.5px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
         background-image: radial-gradient(900px 520px at 8% -10%, var(--glow-1), transparent 60%), radial-gradient(800px 600px at 100% 110%, var(--glow-2), transparent 60%); }
  .t { font-family: "Inter Tight", "Inter", system-ui, sans-serif; letter-spacing: -.02em; }
  main { max-width: 720px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 6px 2px 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; text-decoration: none; color: inherit; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .spacer { flex: 1; }
  .steps { display: flex; gap: 6px; }
  .steps i { width: 26px; height: 5px; border-radius: 3px; background: var(--chip); }
  .steps i.on { background: var(--sun); } .steps i.done { background: color-mix(in srgb, var(--sun) 45%, transparent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 26px; box-shadow: var(--shadow);
          backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }
  h1 { font-size: clamp(28px, 5vw, 38px); line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
  h2 { font-size: 19px; margin: 26px 0 10px; }
  p.lead { color: var(--ink-2); margin: 0 0 18px; font-size: 16.5px; }
  .muted { color: var(--ink-2); } .small { font-size: 13.5px; }
  .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--sun-ink); margin-bottom: 8px; }
  .list { display: grid; gap: 10px; }
  .check { display: flex; gap: 12px; align-items: flex-start; }
  .check .ic { width: 28px; height: 28px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--sun-soft); color: var(--sun-ink); font-weight: 700; font-size: 14px; }
  .actions { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 26px; flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 600; font-size: 15px; border: 0; cursor: pointer; padding: 12px 22px; border-radius: 999px;
         color: #1a1204; background: linear-gradient(180deg, #ffc44d, #ff9a1a); box-shadow: 0 8px 26px -10px rgba(255,154,26,.6); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: var(--chip); color: var(--ink); box-shadow: none; }
  .btn.small { padding: 8px 14px; font-size: 13.5px; }
  .btn.danger { background: var(--warn-soft); color: var(--warn); box-shadow: none; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--net); outline-offset: 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin: 14px 0 6px; }
  .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffcf5c, #ff8a00); transition: width .4s; }
  .dev { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card-solid); cursor: pointer; }
  .dev.sel { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); }
  .dev.bad { cursor: default; }
  .dev .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--chip); flex: none; }
  .dev .ico svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dev .name { font-weight: 650; }
  .dev .meta { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .dev > div:nth-child(2) { flex: 1; }
  .dev .mark { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .dev.sel .mark { background: var(--sun); border-color: var(--sun); }
  .dev.sel .mark::after { content: ""; width: 8px; height: 5px; border: 2px solid #1a1204; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .problem { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: 13.5px; }
  .problem b { color: var(--warn); }
  .ok-note { margin-top: 8px; font-size: 13px; color: var(--good); font-weight: 600; }
  .group-title { font-size: 13px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > .field { flex: 1 1 180px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  label { font-weight: 600; font-size: 14px; }
  .hint { font-size: 12.5px; color: var(--ink-3); }
  input, select { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); color: var(--ink); }
  input[type="time"], input[type="number"] { font-variant-numeric: tabular-nums; }
  input[type="checkbox"] { width: 20px; height: 20px; padding: 0; flex: none; accent-color: var(--sun); margin: 0; }
  h3.sub-t { font-size: 14px; font-weight: 650; margin: 20px 0 8px; letter-spacing: -.005em; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .days button { min-width: 42px; height: 38px; border-radius: 12px; border: 1.5px solid var(--line, rgba(127,127,127,.3)); background: transparent; color: var(--ink-2); font: 600 13.5px Inter, sans-serif; cursor: pointer; }
  .days button.on { border-color: var(--ink); color: var(--ink); background: var(--chip); }
  .time-row { align-items: center; margin-bottom: 6px; }
  label.check-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { font: inherit; display: grid; justify-items: center; gap: 6px; padding: 14px 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink); cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .tile svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tile.on { border-color: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); color: var(--sun-ink); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { font: inherit; font-size: 14px; font-weight: 550; padding: 9px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink-2); cursor: pointer; }
  .chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .live { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 18px; background: var(--card-solid); border: 1px solid var(--line); }
  .live .big { font-size: 40px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good-soft); animation: pulse 1.6s infinite; }
  .pulse.off { background: var(--warn); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--good-soft); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .test { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--chip); margin: 6px 0 16px; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--sun); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
  .err { color: var(--warn); font-size: 14px; min-height: 1.2em; margin-top: 10px; }
  .done-ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--good-soft); color: var(--good); margin-bottom: 14px; }
  .done-ic svg { width: 32px; height: 32px; }
  .settings section { margin-top: 14px; }
  .settings h2 { margin-top: 0; }
  .dev-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .dev-row:last-child { border-bottom: 0; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 560px) { .card { padding: 20px; border-radius: 22px; } .tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .pulse, .spin { animation: none; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="./"><img src="icon.svg" alt="">Zonnestuur</a>
    <div class="spacer"></div>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </header>
  <div id="app"></div>
  <p class="err" id="err" role="alert"></p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- hulpjes ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl = (v, d = 0) => Number(v ?? 0).toLocaleString("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d });
let token = "";
try { token = localStorage.getItem("zs_token") || ""; } catch (e) {}
async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-Token": token, "Content-Type": "application/json" }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    const t = window.prompt ? prompt("Wachtwoord voor Zonnestuur") : "";
    token = t || ""; try { localStorage.setItem("zs_token", token); } catch (e) {}
    return api(path, opts);
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Er ging iets mis (" + r.status + ")");
  return data;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function setErr(msg) { $("err").textContent = msg || ""; }

const ICONS = {
  p1_serial: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M9 17h6M12 21v2"/></svg>',
  p1: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M9 17h6"/></svg>',
  shelly: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="9.5" cy="11" r="1.2"/><circle cx="14.5" cy="11" r="1.2"/><path d="M12 15.5v1"/></svg>',
  boiler: '<svg viewBox="0 0 24 24"><path d="M12 2.5c3 4 6.5 7.5 6.5 11.5a6.5 6.5 0 0 1-13 0c0-4 3.5-7.5 6.5-11.5z"/></svg>',
  ev: '<svg viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M3.5 16h17M7 16v2M17 16v2M6 11h12"/></svg>',
  heatpump: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="10" cy="12" r="4"/><path d="M10 8v8M6 12h8M17 9v6"/></svg>',
  generic: '<svg viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 0 1-12 0zM12 18v3"/></svg>',
  ha: '<svg viewBox="0 0 24 24"><path d="M3.5 11 12 3.5l8.5 7.5V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><circle cx="12" cy="13" r="2"/><path d="M12 15v6M9 10.5l3 2.5 3-2.5"/></svg>',
};
ICONS.hw_socket = ICONS.shelly; ICONS.tasmota = ICONS.shelly; ICONS.shelly_em = ICONS.p1;
const DRIVER_LABEL = {
  shelly: "Shelly", shelly_gen1: "Shelly (oud model)", homewizard_socket: "HomeWizard Energy Socket", tasmota: "Tasmota",
  esphome: "ESPHome", mqtt_switch: "MQTT", homey_switch: "Homey · aan/uit", homey_setpoint: "Homey · temperatuur",
  sg_ready: "SG-ready (2 relais)", ocpp: "Laadpaal · OCPP",
  ha_switch: "Home Assistant · schakelaar", ha_start_button: "Home Assistant · witgoed starten", ha_setpoint: "Home Assistant · temperatuur", ha_current: "Home Assistant · laadstroom",
};
const METERS = [["p1_serial", "P1-kabel in dit kastje"], ["homewizard", "HomeWizard P1-meter"], ["shelly_em", "Shelly EM / Pro 3EM"], ["youless", "YouLess (LS120)"],
  ["dsmr_reader", "DSMR-reader"], ["esphome", "ESPHome (SlimmeLezer e.a.)"], ["ha", "Sensor in Home Assistant", "has_ha"],
  ["mqtt", "MQTT-topic", "mqtt"], ["homey", "Homey Pro", "has_homey_token"]];
const ADD_TYPES = [["z2m", "Zigbee-stekker (Zigbee2MQTT)"], ["tasmota", "Tasmota via MQTT"], ["shellymqtt", "Shelly via MQTT"],
  ["mqttfree", "Eigen MQTT-topics"], ["esphome", "ESPHome-schakelaar"], ["homey", "Homey-apparaat"], ["ocpp", "Laadpaal via OCPP"],
  ["sgready", "SG-ready warmtepomp (2 relais)"]];
let SYS = { mqtt: null, homey: null, ocpp: null };
const hasSys = (need) => need === "mqtt" ? !!((CFG.mqtt && CFG.mqtt.host) || CFG.mqtt_addon) : !!CFG[need];
const METER_KINDS = ["p1_serial", "p1", "shelly_em"], SWITCH_KINDS = ["shelly", "hw_socket", "tasmota"];
const isHA = (drv) => String(drv || "").startsWith("ha_");
const KINDS = [
  { id: "boiler", label: "Boiler" }, { id: "ev", label: "Elektrische auto" },
  { id: "heatpump", label: "Warmtepomp" }, { id: "generic", label: "Iets anders" },
];
// Standaardinstellingen per soort apparaat (overschrijfbaar in 'Geavanceerd')
const KIND_DEFAULTS = {
  boiler: { ready_times: ["18:00"], guarantee_min: 150, full_lookback_h: 2, expected_run_min: 150, detect_full: true, min_on_s: 600, min_off_s: 300 },
  ev: { ready_times: ["07:30"], guarantee_min: 240, full_lookback_h: 12, expected_run_min: 180, detect_full: true, min_on_s: 900, min_off_s: 600 },
  heatpump: { ready_times: [], guarantee_min: 0, full_lookback_h: 4, expected_run_min: 120, detect_full: false, min_on_s: 1200, min_off_s: 900 },
  generic: { ready_times: [], guarantee_min: 0, full_lookback_h: 4, expected_run_min: 0, detect_full: false, min_on_s: 300, min_off_s: 300 },
};
const REGIONS = {
  "Groningen": [53.22, 6.57], "Friesland": [53.1, 5.8], "Drenthe": [52.86, 6.62], "Overijssel": [52.44, 6.44],
  "Flevoland": [52.52, 5.6], "Gelderland": [52.06, 5.94], "Utrecht": [52.08, 5.18], "Noord-Holland": [52.52, 4.79],
  "Zuid-Holland": [52.0, 4.5], "Zeeland": [51.49, 3.83], "Noord-Brabant": [51.55, 5.2], "Limburg": [51.2, 5.9],
};
const ORIENT = { "Zuid": 0, "Zuidoost": -45, "Zuidwest": 45, "Oost-west": 0, "Oost": -90, "West": 90 };

function nearestRegion(lat, lon) {
  let best = "Gelderland", bd = 1e9;
  for (const [k, [a, b]] of Object.entries(REGIONS)) { const d = (a - lat) ** 2 + (b - lon) ** 2; if (d < bd) { bd = d; best = k; } }
  return best;
}
function slug(s) { return (s || "apparaat").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "apparaat"; }

// ---------- toestand ----------
const MODE = location.pathname.includes("instellingen") ? "settings" : "setup";
let CFG = null;                 // huidige configuratie van de server
const W = {                     // wat de assistent verzamelt
  meter: null,                  // {type: "p1"|"shelly_em", host, f} of {type: "ha", entity, name}
  picks: [],                    // gekozen apparaten: {key, source: "found", f} of {key, source: "ha", c}
  ha: { connected: false, url: "", cands: null, open: false },
  invert: false, devices: [], contract: { type: "fixed", import_price: 0.29, feed_in_price: 0.01 },
  solar: { kwp: 4, orient: "Zuid", region: "Gelderland" }, addOnly: location.hash === "#toevoegen",
};
let step = 0, scanTimer = null, p1Timer = null;
const STEPS = ["welkom", "zoeken", "meter", "apparaten", "vragen", "klaar"];

function renderSteps() {
  if (MODE !== "setup") { $("steps").innerHTML = ""; return; }
  $("steps").innerHTML = STEPS.map((_, i) => `<i class="${i === step ? "on" : i < step ? "done" : ""}"></i>`).join("");
}
function go(n) {
  clearInterval(scanTimer); clearInterval(p1Timer); setErr("");
  step = n; renderSteps(); window.scrollTo(0, 0);
  ({ welkom, zoeken, meter, apparaten, vragen, klaar })[STEPS[n]]();
}

// ---------- stap 1: welkom ----------
function welkom() {
  $("app").innerHTML = `<section class="card">
    <div class="eyebrow">Koppelen · ongeveer 5 minuten</div>
    <h1 class="t">${W.addOnly ? "Apparaat toevoegen" : "Welkom bij Zonnestuur"}</h1>
    <p class="lead">${W.addOnly ? "We zoeken de nieuwe schakelaar in je netwerk en testen hem even." :
      "We zoeken je apparaten in je thuisnetwerk. Je hoeft geen adressen of codes over te typen."}</p>
    <div class="list">
      ${W.addOnly ? "" : `<div class="check"><span class="ic">1</span><div><b>Een meter die ziet wat je teruglevert</b><div class="small muted">HomeWizard P1-meter (zet in de HomeWizard-app <b>Lokale API</b> aan), een Shelly EM / Pro 3EM, of een sensor in Home Assistant.</div></div></div>`}
      <div class="check"><span class="ic">${W.addOnly ? 1 : 2}</span><div><b>Iets om te sturen</b><div class="small muted">Een slimme stekker of schakelaar (Shelly, HomeWizard Energy Socket, Tasmota), of alles wat in Home Assistant zit: warmtepomp, laadpaal, auto.</div></div></div>
      <div class="check"><span class="ic">${W.addOnly ? 2 : 3}</span><div><b>Alles op hetzelfde netwerk</b><div class="small muted">Zonnestuur moet je meter en apparaten (of Home Assistant) kunnen bereiken.</div></div></div>
    </div>
    <div class="actions"><span class="small muted">${W.addOnly ? '<a href="instellingen">Terug naar instellingen</a>' : ""}</span>
      <button class="btn" id="next">Start zoeken →</button></div>
  </section>`;
  $("next").onclick = () => go(1);
}

// ---------- stap 2: zoeken ----------
let FOUND = [];
function zoeken() {
  $("app").innerHTML = `<section class="card">
    <div class="eyebrow">Stap 2</div>
    <h1 class="t">Apparaten zoeken</h1>
    <p class="lead" id="scanText">We kijken welke apparaten er in je netwerk zijn…</p>
    <div class="bar"><span id="scanBar"></span></div>
    <div id="found"></div>
    ${W.addOnly ? "" : `<label class="check-row" style="margin-top:16px"><input type="checkbox" id="noPanels" ${W.noPanels ? "checked" : ""}> Ik heb geen zonnepanelen <span class="muted">— dan is geen meter nodig en draait alles in de goedkoopste uren (dynamisch contract nodig)</span></label>`}
    <details id="manual"><summary>Staat je apparaat er niet bij? Vul het IP-adres in</summary>
      <div class="row" style="margin-top:12px">
        <div class="field"><label for="manualIp">IP-adres</label><input id="manualIp" placeholder="192.168.1.50" inputmode="decimal" autocomplete="off"><span class="hint">Te vinden in de app van het apparaat, onder apparaatinformatie.</span></div>
        <div class="field" style="flex:0 0 auto"><button class="btn ghost" id="manualBtn">Controleren</button></div>
      </div></details>
    <div class="actions"><button class="btn ghost" id="back">← Terug</button>
      <div class="row"><button class="btn ghost small" id="again">Opnieuw zoeken</button><button class="btn" id="next" disabled>Verder →</button></div></div>
  </section>`;
  $("back").onclick = () => go(0);
  $("again").onclick = startScan;
  $("next").onclick = () => go(W.addOnly || !W.meter ? 3 : 2);
  if ($("noPanels")) $("noPanels").onchange = () => { W.noPanels = $("noPanels").checked; if (W.noPanels) W.contract.type = "dynamic"; renderFound(); };
  $("manualBtn").onclick = async () => {
    const host = $("manualIp").value.trim();
    if (!host) return;
    setErr("");
    try {
      const r = await api("api/setup/identify", { method: "POST", body: JSON.stringify({ host }) });
      if (!r.found) { setErr(`Op ${host} vonden we geen meter of schakelaar die we kennen. Klopt het adres?`); return; }
      r.found._manual = true;
      FOUND = FOUND.filter((f) => f.host !== r.found.host).concat(r.found);
      renderFound();
    } catch (e) { setErr(e.message); }
  };
  startScan();
  if (CFG.has_ha && !W.ha.cands) loadHA();
}
async function startScan() {
  try {
    await api("api/setup/scan", { method: "POST", body: "{}" });
    clearInterval(scanTimer);
    scanTimer = setInterval(pollScan, 1000);
    pollScan();
  } catch (e) { setErr(e.message); }
}
async function pollScan() {
  try {
    const s = await api("api/setup/scan");
    const manual = FOUND.filter((f) => !s.found.some((x) => x.host === f.host) && f._manual);
    FOUND = s.found.concat(manual);
    if ($("scanBar")) $("scanBar").style.width = Math.round(s.progress * 100) + "%";
    if ($("scanText")) $("scanText").textContent = s.running ? "We kijken welke apparaten er in je netwerk zijn…"
      : FOUND.length || (W.ha.cands && W.ha.cands.devices.length) ? "Klaar met zoeken. Kies wat bij Zonnestuur hoort." : "We vonden niets. Staan de apparaten op dezelfde wifi? Of vul hieronder het IP-adres in.";
    if (!s.running) clearInterval(scanTimer);
    renderFound();
  } catch (e) { clearInterval(scanTimer); setErr(e.message); }
}
async function loadHA() {
  try {
    const r = await api("api/setup/ha");
    if (r.ok) { W.ha.connected = true; W.ha.cands = r; renderFound(); }
  } catch (e) {}
}
async function connectHA() {
  const url = $("haUrl").value.trim(), tok = $("haTok").value.trim();
  $("haMsg").textContent = "Verbinden…";
  try {
    const r = await api("api/setup/ha", { method: "POST", body: JSON.stringify({ url, token: tok }) });
    if (!r.ok) { $("haMsg").textContent = r.error; return; }
    W.ha = { connected: true, url, cands: r, open: false };
    CFG = await api("api/config");
    toast(`Gekoppeld: ${r.devices.length} apparaten gevonden`);
    renderFound();
  } catch (e) { $("haMsg").textContent = e.message; }
}
function renderFound() {
  const el = $("found"); if (!el) return;
  const meters = FOUND.filter((f) => METER_KINDS.includes(f.kind)), sw = FOUND.filter((f) => SWITCH_KINDS.includes(f.kind));
  const inUse = new Set((CFG?.devices || []).map((d) => d.host || JSON.stringify(d.params || {})));
  const picked = (key) => W.picks.some((p) => p.key === key);
  const card = (key, kind, icon, name, meta, sel, ok, problem, taken) => `<div class="dev ${sel ? "sel" : ""} ${ok && !taken ? "" : "bad"}" data-key="${esc(key)}" data-kind="${kind}" role="button" tabindex="0" aria-pressed="${sel}">
      <div class="ico">${icon}</div>
      <div style="min-width:0"><div class="name">${esc(name)}</div><div class="meta">${meta}</div>
        ${ok ? "" : `<div class="problem"><b>Nog niet bruikbaar.</b> ${problem} <button class="btn ghost small" data-recheck="${esc(key.slice(2))}" style="margin-top:8px">Opnieuw controleren</button></div>`}
        ${taken ? `<div class="ok-note">Al gekoppeld</div>` : ""}
      </div>${ok && !taken ? '<span class="mark"></span>' : ""}</div>`;
  const foundCard = (f, asMeter) => {
    const key = "f:" + f.host;
    const sel = asMeter ? W.meter && W.meter.host === f.host && W.meter.type !== "ha" : picked(key);
    let meta = esc(f.host);
    if (f.ok && f.kind === "p1_serial") meta = `P1-kabel in dit kastje · leest nu ${nl(Math.abs(f.extra.active_power_w) / 1000, 2)} kW ${f.extra.active_power_w < 0 ? "teruglevering" : "afname"}`;
    else if (f.ok && f.kind === "p1") meta += ` · leest nu ${nl(Math.abs(f.extra.active_power_w) / 1000, 2)} kW ${f.extra.active_power_w < 0 ? "teruglevering" : "afname"}`;
    else if (f.ok && f.kind === "shelly_em") meta += " · meet het hele huis";
    else if (f.ok) meta += f.extra && f.extra.metering ? " · meet ook verbruik" : " · meet geen verbruik";
    return card(key, asMeter ? "meter" : "found", ICONS[f.kind] || ICONS.generic, f.name || f.model, meta, sel, f.ok, esc(f.problem_text), !asMeter && inUse.has(f.host));
  };
  let html = "";
  const cands = W.ha.connected && W.ha.cands;
  if (!W.addOnly) {
    let haMeters = "";
    if (cands) {
      const sensors = cands.power_sensors.filter((p) => !p.export).slice(0, 6);
      haMeters = sensors.map((p) => {
        const exp = p.export_entity ? cands.power_sensors.find((q) => q.entity === p.export_entity) : null;
        return card("m:" + p.entity, "hameter", ICONS.ha, p.name,
          `${esc(p.entity)} · nu ${esc(p.state)} ${esc(p.unit)}${exp ? ` · teruglevering via ${esc(exp.name)}` : ""}`,
          W.meter && W.meter.type === "ha" && W.meter.entity === p.entity, true, "", false);
      }).join("");
    }
    html += `<div class="group-title">Meter</div><div class="list">${meters.map((f) => foundCard(f, true)).join("") + haMeters ||
      '<p class="small muted">Nog geen meter gevonden. Heb je Home Assistant? Koppel het hieronder, dan kun je daar een meter kiezen.</p>'}</div>`;
  }
  html += `<div class="group-title">Slimme stekkers en schakelaars</div><div class="list">${sw.length ? sw.map((f) => foundCard(f, false)).join("") : '<p class="small muted">Nog niets gevonden.</p>'}</div>`;
  html += `<div class="group-title">Home Assistant</div>`;
  if (cands) {
    html += `<p class="small muted" style="margin:-4px 0 10px">Gekoppeld met ${esc(W.ha.url || CFG.homeassistant?.url || "Home Assistant")}. Kies wat Zonnestuur mag sturen.</p><div class="list">${
      cands.devices.length ? cands.devices.map((c) => {
        const ent = c.entity || c.current_entity || c.button_entity, key = "h:" + ent;
        const what = c.driver === "ha_start_button" ? "programma starten bij zon" : c.driver === "ha_current" ? "laadstroom traploos regelen" : c.driver === "ha_setpoint" ? `temperatuur ${nl(c.normal_temp, 1)} → ${nl(c.boost_temp, 1)} °C bij zon` : "aan/uit";
        const taken = (CFG?.devices || []).some((d) => d.params && (d.params.entity === ent || d.params.current_entity === ent || d.params.button_entity === ent));
        return card(key, "ha", ICONS[c.kind] || ICONS.generic, c.name, `${esc(ent)} · ${what}${c.warning ? ` · <b style="color:var(--warn,#e5484d)">${esc(c.warning)}</b>` : ""}`, picked(key), true, "", taken);
      }).join("") : '<p class="small muted">In Home Assistant vonden we geen schakelaars, thermostaten of laadpalen.</p>'}</div>
      ${(cands.readonly_chargers || []).map((r) => `<div class="problem" style="margin-top:10px"><b>Laadpaal ${esc(r.name)} gevonden, maar nog niet te sturen.</b> Home Assistant kan hem nu alleen uitlezen (via ${esc(r.via)}). ${r.brand === "zaptec" ? "Installeer in HACS de integratie <b>Zaptec</b> en log in met je Zaptec-account; daarna staat hij hier met laadstroom erbij." : "Installeer de Home Assistant-integratie van het merk van je laadpaal; daarna staat hij hier."}</div>`).join("")}`;
  } else {
    html += `<details id="haBox" ${W.ha.open ? "open" : ""}><summary>Koppel Home Assistant voor warmtepompen, laadpalen en auto's</summary>
      <p class="small muted" style="margin-top:10px">Alles wat Home Assistant kan bedienen, kan Zonnestuur dan op zonnestroom laten lopen: een warmtepomp (Daikin, Mitsubishi, Nibe…), laadpaal (Easee, Zaptec, Alfen, Wallbox…) of auto (Tesla, Volkswagen…). Maak in Home Assistant bij je profiel onder <b>Beveiliging</b> een <b>langlevend toegangstoken</b> aan.</p>
      <div class="row" style="margin-top:8px">
        <div class="field"><label for="haUrl">Adres</label><input id="haUrl" placeholder="http://homeassistant.local:8123" value="${esc(W.ha.url)}" autocomplete="off"></div>
        <div class="field"><label for="haTok">Toegangstoken</label><input id="haTok" type="password" autocomplete="off"></div>
        <div class="field" style="flex:0 0 auto"><button class="btn ghost" id="haBtn">Koppelen</button></div>
      </div><p class="small muted" id="haMsg" role="status"></p></details>`;
  }
  el.innerHTML = html;
  if ($("haBox")) $("haBox").ontoggle = () => { W.ha.open = $("haBox").open; };
  if ($("haBtn")) $("haBtn").onclick = connectHA;
  el.querySelectorAll(".dev:not(.bad)").forEach((d) => {
    const toggle = () => {
      const key = d.dataset.key, kind = d.dataset.kind;
      if (kind === "meter") { const f = FOUND.find((x) => "f:" + x.host === key); W.meter = { type: f.kind, host: f.host, f }; }
      else if (kind === "hameter") { const p = cands.power_sensors.find((x) => "m:" + x.entity === key); W.meter = { type: "ha", entity: p.entity, export_entity: p.export_entity || "", name: p.name }; }
      else if (W.picks.some((p) => p.key === key)) W.picks = W.picks.filter((p) => p.key !== key);
      else if (kind === "found") W.picks.push({ key, source: "found", f: FOUND.find((x) => "f:" + x.host === key) });
      else W.picks.push({ key, source: "ha", c: cands.devices.find((c) => "h:" + (c.entity || c.current_entity || c.button_entity) === key) });
      renderFound();
    };
    d.onclick = toggle; d.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  });
  el.querySelectorAll("[data-recheck]").forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    const r = await api("api/setup/identify", { method: "POST", body: JSON.stringify({ host: b.dataset.recheck }) });
    if (r.found) { r.found._manual = true; FOUND = FOUND.filter((f) => f.host !== r.found.host).concat(r.found); renderFound(); if (r.found.ok) toast("Gelukt, nu bruikbaar"); }
  });
  const ready = (W.addOnly || W.meter || W.noPanels) && W.picks.length > 0;
  if ($("next")) $("next").disabled = !ready;
}

// ---------- stap 3: meter controleren ----------
function meterSpec(m, invert) {
  if (m.type === "ha" && m.export_entity) return { meter: { driver: "ha", import_entity: m.entity, export_entity: m.export_entity, invert } };
  if (m.type === "ha") return { meter: { driver: "ha", entity: m.entity, invert } };
  if (m.type === "p1_serial") return { host: "", meter: { driver: "p1_serial", port: m.host, invert } };
  return { host: m.host, meter: { driver: m.type === "shelly_em" ? "shelly_em" : "homewizard", host: m.host, invert } };
}
function meter() {
  const m = W.meter;
  $("app").innerHTML = `<section class="card">
    <div class="eyebrow">Stap 3</div>
    <h1 class="t">Je meter uitlezen</h1>
    <p class="lead">Zonnestuur leest nu live mee met ${m.type === "ha" ? esc(m.name) + " in Home Assistant" : esc(m.f.name)}.</p>
    <div class="live"><span class="pulse" id="pulse"></span><div><div class="big t" id="p1w">–</div><div class="small muted" id="p1t">verbinden…</div></div></div>
    <p class="small muted" style="margin-top:14px">Negatief betekent: je levert terug aan het net. Dat is precies de stroom die Zonnestuur straks in je eigen huis wil gebruiken.</p>
    ${m.type === "p1" ? "" : `<label class="check-row"><input type="checkbox" id="inv" ${W.invert ? "checked" : ""}> Plus en min omdraaien <span class="muted">(zet dit aan als hij negatief toont terwijl je stroom afneemt)</span></label>`}
    <div class="actions"><button class="btn ghost" id="back">← Terug</button><button class="btn" id="next" disabled>Klopt, verder →</button></div>
  </section>`;
  $("back").onclick = () => go(1);
  $("next").onclick = () => go(3);
  if ($("inv")) $("inv").onchange = () => { W.invert = $("inv").checked; poll(); };
  const poll = async () => {
    try {
      const r = await api("api/setup/meter", { method: "POST", body: JSON.stringify(meterSpec(m, W.invert)) });
      if (r.ok) {
        $("p1w").textContent = (r.grid_w < 0 ? "−" : "") + nl(Math.abs(r.grid_w) / 1000, 2) + " kW";
        $("p1t").textContent = r.grid_w < 0 ? "je levert nu terug" : "je haalt nu stroom van het net";
        $("pulse").classList.remove("off"); $("next").disabled = false; setErr("");
      } else { $("pulse").classList.add("off"); $("p1t").textContent = "geen gegevens"; setErr(r.problem_text); }
    } catch (e) { setErr(e.message); }
  };
  poll(); p1Timer = setInterval(poll, 2000);
}

// ---------- stap 4: apparaten ----------
let devIdx = 0;
function deviceFromPick(p) {
  if (p.source === "found") {
    return { key: p.key, host: p.f.host, driver: p.f.driver || "shelly", switch_id: 0, params: {}, kind: "boiler", name: "Boiler",
      power_w: 2000, tested: null, model: `${p.f.name} op ${p.f.host}` };
  }
  const c = p.c, params = {};
  for (const k of ["entity", "current_entity", "switch_entity", "power_entity", "normal_temp", "boost_temp", "min_a", "max_a", "button_entity", "remote_entity", "min_interval_s", "plug_entity"]) if (c[k] !== undefined && c[k] !== "") params[k] = c[k];
  if (c.driver === "ha_current") params.phases = 3;
  const power = c.power_w || (c.driver === "ha_current" ? 11000 : c.kind === "heatpump" ? 1500 : 2000);
  return { key: p.key, host: "", driver: c.driver, switch_id: 0, params, kind: c.kind, name: c.name, power_w: power, tested: null,
    model: `Home Assistant · ${c.entity || c.current_entity || c.button_entity}` };
}
function evRange(d) { const w = 230 * (d.params.phases || 1); return [d.params.min_a * w, d.params.max_a * w]; }
function apparaten() {
  W.devices = W.picks.map((p) => W.devices.find((d) => d.key === p.key) || deviceFromPick(p));
  devIdx = Math.min(devIdx, W.devices.length - 1);
  const d = W.devices[devIdx], P = d.params, drv = d.driver;
  const readyLabel = d.kind === "ev" ? "Auto geladen om" : "Warm water klaar om";
  let extra = "";
  if (drv === "ha_setpoint") extra = `<div class="row">
      <div class="field"><label for="tnorm">Normale temperatuur (°C)</label><input id="tnorm" type="number" step="0.5" value="${P.normal_temp}"></div>
      <div class="field"><label for="tboost">Temperatuur bij zon (°C)</label><input id="tboost" type="number" step="0.5" value="${P.boost_temp}"><span class="hint">Bij zon zetten we hem hoger, zodat hij de warmte opslaat in water of huis.</span></div></div>`;
  if (drv === "ha_current") {
    const [lo, hi] = evRange(d);
    extra = `<div class="row">
      <div class="field"><label for="phases">Aansluiting</label><select id="phases"><option value="1" ${P.phases == 1 ? "selected" : ""}>1 fase</option><option value="3" ${P.phases == 3 ? "selected" : ""}>3 fasen</option></select></div>
      <div class="field"><label for="mina">Minimaal (A)</label><input id="mina" type="number" min="6" max="32" value="${P.min_a}"></div>
      <div class="field"><label for="maxa">Maximaal (A)</label><input id="maxa" type="number" min="6" max="32" value="${P.max_a}"></div></div>
      <p class="small muted">Zonnestuur regelt de laadstroom traploos tussen <b>${nl(lo / 1000, 1)}</b> en <b>${nl(hi / 1000, 1)} kW</b>, precies op wat je overhoudt.${(P.min_interval_s || 0) > 60 ? ` Deze laadpaal passen we hooguit eens per ${Math.round(P.min_interval_s / 60)} minuten aan (advies van de fabrikant), met wat je dat hele kwartier minstens overhield.` : ""}</p>`;
  }
  $("app").innerHTML = `<section class="card">
    <div class="eyebrow">Stap 4 · apparaat ${devIdx + 1} van ${W.devices.length}</div>
    <h1 class="t">${isHA(drv) ? "Wat is dit voor apparaat?" : "Wat zit er aan deze schakelaar?"}</h1>
    <p class="lead">${esc(d.model)}</p>
    <div class="tiles" role="radiogroup" aria-label="Soort apparaat">${KINDS.map((k) => `<button class="tile ${d.kind === k.id ? "on" : ""}" data-kind="${k.id}" role="radio" aria-checked="${d.kind === k.id}">${ICONS[k.id]}${k.label}</button>`).join("")}</div>
    <div class="row" style="margin-top:16px">
      <div class="field"><label for="dname">Naam</label><input id="dname" value="${esc(d.name)}" maxlength="40"></div>
      ${KIND_DEFAULTS[d.kind].ready_times.length ? `<div class="field" style="flex:0 1 180px"><label for="dready">${readyLabel}</label><input id="dready" type="time" value="${esc((d.ready_times || KIND_DEFAULTS[d.kind].ready_times)[0])}"></div>` : ""}
    </div>
    ${extra}
    <h2 class="t">Test de koppeling</h2>
    <p class="small muted" style="margin-top:-4px">${drv === "ha_start_button" ? "We starten geen programma om te testen. We kijken alleen of hij bereikbaar is." : drv === "ha_setpoint" ? "We zetten de temperatuur een paar seconden hoger en daarna terug." : drv === "ha_current" ? "We starten het laden een paar seconden op de laagste stroom." : "We zetten hem een paar seconden aan en meten wat het apparaat opneemt."}</p>
    <div class="test" id="testBox">${testHtml(d)}</div>
    ${drv === "ha_start_button" ? `<p class="small muted">Zo gebruik je hem: vul de machine, kies het programma en zet hem op <b>Start op afstand</b> (MobileStart). Zonnestuur drukt op start zodra er genoeg zon is. Een gestart programma zet Zonnestuur nooit stop.</p>` : ""}
    ${drv === "ha_current" ? "" : `<div class="row"><div class="field" style="flex:0 1 220px"><label for="dpower">Vermogen (watt)</label><input id="dpower" type="number" min="100" max="25000" step="50" value="${d.power_w}"><span class="hint">${drv === "ha_setpoint" || drv === "ha_start_button" ? "Wat hij ongeveer gemiddeld opneemt als hij draait." : "Staat ook op het typeplaatje."}</span></div></div>`}
    <div class="actions"><button class="btn ghost" id="back">← Terug</button><button class="btn" id="next">${devIdx < W.devices.length - 1 ? "Volgende →" : W.addOnly ? "Opslaan →" : "Verder →"}</button></div>
  </section>`;
  const save = () => {
    d.name = $("dname").value.trim() || KINDS.find((x) => x.id === d.kind).label;
    if ($("dpower")) d.power_w = Math.max(100, Math.min(25000, Number($("dpower").value) || 2000));
    if ($("dready")) d.ready_times = [$("dready").value || KIND_DEFAULTS[d.kind].ready_times[0]];
    if ($("tnorm")) { P.normal_temp = Number($("tnorm").value); P.boost_temp = Number($("tboost").value); }
    if ($("phases")) {
      P.phases = Number($("phases").value); P.min_a = Math.max(6, Number($("mina").value) || 6); P.max_a = Math.max(P.min_a, Math.min(32, Number($("maxa").value) || 16));
      d.power_w = Math.min(25000, Math.round(evRange(d)[1]));
    }
  };
  document.querySelectorAll(".tile").forEach((b) => b.onclick = () => {
    save(); const k = b.dataset.kind;
    if (d.name === (KINDS.find((x) => x.id === d.kind) || {}).label || !d.name) d.name = KINDS.find((x) => x.id === k).label;
    d.kind = k; d.ready_times = null; apparaten();
  });
  if ($("phases")) ["phases", "mina", "maxa"].forEach((id) => $(id).onchange = () => { save(); apparaten(); });
  $("testBtn").onclick = async () => {
    save(); $("testBox").innerHTML = '<span class="spin"></span><span>Aan het testen… luister of je het apparaat hoort aanslaan.</span>';
    try {

let SUP = null, PRICE_SENSORS = null;

const eur = (v, d = 4) => (v == null || v === "" ? "–" : "€ " + nl(v, d));
function applySupplier(c, key) {

  if (c.type === "fixed" && SUP.fixed[key]) { c.feed_in_price = SUP.fixed[key].feed_in_2027; c.return_cost = SUP.fixed[key].return_cost_2027; }

    info += `<br>Tarieven voor een nieuw 1-jarig contract, gecontroleerd op ${esc(String(SUP.checked_on).split("-").reverse().join("-"))} · <a href="${esc(SUP.fixed_source)}" target="_blank" rel="noopener">bron</a>. Staat in je contract iets anders? Pas het hieronder aan.`;

      <div class="field"><label for="cp_fa">Teruglevering: + of − op de marktprijs</label><input id="cp_fa" type="number" step="0.0001" value="${c.feed_in_adjust ?? -(c.feed_in_cost ?? 0)}"></div>

    </div></details>`}

function readContract(c) {

function bindContract(c, rerender) {

function buildDevice(d, taken) {
  let id = slug(d.name); let n = 2; const base = id;
  while (taken.has(id)) id = base + "-" + n++;
  taken.add(id);
  const k = KIND_DEFAULTS[d.kind];
  return Object.assign({ id, name: d.name, host: d.host || "", driver: d.driver || "shelly", params: d.params || {},
    switch_id: d.switch_id || 0, kind: d.kind, power_w: d.power_w, priority: 1 },
    k, { ready_times: k.ready_times.length ? (d.ready_times || k.ready_times) : [] });
}
async function postCfg(next) {
  delete next.homeassistant;            // Home Assistant wordt apart gekoppeld (token blijft op het kastje)
  delete next.has_ha;
  return api("api/config", { method: "POST", body: JSON.stringify(next) });
}
async function saveAll() {
  setErr("");
  const next = JSON.parse(JSON.stringify(CFG));
  const taken = new Set((next.devices || []).map((d) => d.id));
  const newDevs = W.devices.map((d) => buildDevice(d, taken));
  if (W.addOnly) {
    next.devices = (next.devices || []).concat(newDevs.map((d, i) => ({ ...d, priority: (next.devices || []).length + i + 1 })));
  } else {
    const m = W.meter;
    next.p1_host = m && m.type !== "ha" ? m.host : "";
    next.meter = m ? meterSpec(m, W.invert).meter : {};
    next.devices = newDevs.map((d, i) => ({ ...d, priority: i + 1 }));
    next.contract = Object.assign({}, next.contract || {}, W.contract);
    const [lat, lon] = REGIONS[W.solar.region];
    next.solar = Object.assign({}, next.solar || {}, { kwp: W.solar.kwp, azimuth: ORIENT[W.solar.orient], latitude: lat, longitude: lon,
      tilt: W.solar.orient === "Oost-west" ? 15 : 35, has_panels: !W.noPanels });
  }
  try {
    CFG = await postCfg(next);
    go(5);
  } catch (e) { setErr(e.message); }
}

    if (t === "sgready") $("x_kind").value = "heatpump";
  };
  $("x_type").onchange = addFields;
  addFields();
  const relaySpec = (p) => { const t = $(p + "_t").value, a = $(p + "_a").value.trim(), ch = Number($(p + "_c").value) || 0;
    return t === "ha_switch" ? { driver: "ha_switch", params: { entity: a } } : t === "z2m" ? { driver: "mqtt_switch", params: { profile: "zigbee2mqtt", name: a } } : { driver: t, host: a, switch_id: ch }; };
  $("x_add").onclick = async () => {
    const t = $("x_type").value, g = (id) => ($(id) ? $(id).value.trim() : ""), name = g("x_name") || ADD_TYPES.find((x) => x[0] === t)[1];
    const kind = $("x_kind").value;
    let dev = { name, kind, power_w: Number(g("x_pw")) || 2000, host: "" };
    if (t === "z2m") dev = { ...dev, driver: "mqtt_switch", params: { profile: "zigbee2mqtt", name: g("x_a") } };
    else if (t === "tasmota") dev = { ...dev, driver: "mqtt_switch", params: { profile: "tasmota", name: g("x_a") } };
    else if (t === "shellymqtt") dev = { ...dev, driver: "mqtt_switch", params: { profile: "shelly", name: g("x_a") } };
    else if (t === "mqttfree") dev = { ...dev, driver: "mqtt_switch", params: { state: g("x_a"), state_key: g("x_b"), command: g("x_c"), power: g("x_d"), power_key: g("x_e"), on: g("x_on") || "ON", off: g("x_off") || "OFF" } };
    else if (t === "esphome") dev = { ...dev, driver: "esphome", host: g("x_a"), params: { switch: g("x_b"), power_sensor: g("x_c") } };
    else if (t === "homey") { const hdv = (SYS.homey?.devices || [])[Number(g("x_a"))]; if (!hdv) { $("x_res").textContent = "Koppel eerst je Homey."; return; }
      dev = { ...dev, driver: hdv.driver, params: hdv.driver === "homey_setpoint" ? { device: hdv.device, normal_temp: Number(g("x_tn")), boost_temp: Number(g("x_tb")) } : { device: hdv.device } }; }
    else if (t === "ocpp") { const ph = Number(g("x_ph")), mx = Number(g("x_max")) || 16;
      dev = { ...dev, driver: "ocpp", params: { cp_id: g("x_a"), phases: ph, min_a: Number(g("x_min")) || 6, max_a: mx }, power_w: Math.min(25000, mx * 230 * ph) }; }
    else if (t === "sgready") dev = { ...dev, driver: "sg_ready", params: { a: relaySpec("ra"), b: relaySpec("rb"), force: $("x_force").checked } };
    const need = { z2m: "x_a", tasmota: "x_a", shellymqtt: "x_a", mqttfree: "x_c", esphome: "x_b", ocpp: "x_a" }[t];
    if (need && !g(need)) { $("x_res").textContent = "Vul eerst in welk apparaat het is."; $(need).focus(); return; }
    if (t === "esphome" && !g("x_a")) { $("x_res").textContent = "Vul het adres van het ESPHome-apparaat in."; return; }
    if (t === "sgready" && (!$("ra_a").value.trim() || !$("rb_a").value.trim())) { $("x_res").textContent = "Vul voor beide relais het adres of de naam in."; return; }
    const base = name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "apparaat";
    let id = base, n = 2; while (CFG.devices.some((d) => d.id === id)) id = `${base}-${n++}`;
    const next = JSON.parse(JSON.stringify(CFG));
    next.devices.push({ id, ...KIND_DEFAULTS[kind], ...dev, priority: CFG.devices.length + 1 });
    try { CFG = await postCfg(next); toast(`${name} toegevoegd`); settings(); } catch (e) { $("x_res").textContent = e.message; }
  };
  $("p1test").onclick = async () => {
    const m = meterFromForm();
    const r = await api("api/setup/meter", { method: "POST", body: JSON.stringify({ host: m.p1_host, meter: m.meter }) });
    $("p1res").textContent = r.ok ? `Werkt: ${nl(r.grid_w)} W bij de meter.` : r.problem_text;
  };
  $("s_habtn").onclick = async () => {
    $("s_hares").textContent = "Verbinden…";
    try {
      const r = await api("api/setup/ha", { method: "POST", body: JSON.stringify({ url: $("s_haurl").value.trim(), token: $("s_hatok").value.trim() }) });
      if (!r.ok) { $("s_hares").textContent = r.error; return; }
      CFG = await api("api/config"); settings(); toast(`Gekoppeld: ${r.devices.length} apparaten beschikbaar`);
    } catch (e) { $("s_hares").textContent = e.message; }
  };
  licenseCard();
  const bindBattery = () => { if ($("b_on")) $("b_on").onchange = () => { $("b_form").hidden = !$("b_on").checked; }; };
  bindBattery();
  if (CFG.has_ha) {
    (async () => {
      try {
        const r = await api("api/setup/ha");
        if (r.ok === false) return;
        $("i_list").innerHTML = (r.inverter_limits || []).map((x) => `<option value="${esc(x.entity)}">${esc(x.name)} (${esc(x.unit)})</option>`).join("");
        const inv = r.inverter_limits || [];
        $("i_hint").textContent = inv.length ? `Gevonden: ${inv.map((x) => x.name).join(", ")}.` : "Geen omvormer-begrenzing gevonden in Home Assistant. Veel omvormers (SolarEdge, Huawei, Growatt, Hoymiles via OpenDTU) hebben er een via hun integratie.";
        $("i_ent").onchange = () => { const x = inv.find((y) => y.entity === $("i_ent").value); if (x) $("i_unit").value = ["W", "kW", "%"].includes(x.unit) ? x.unit : "W"; };
        if ($("s_pvl")) $("s_pvl").innerHTML = (r.power_sensors || []).filter((x) => /pv|solar|zon|opwek|inverter|omvormer|production|productie/i.test(x.entity + " " + x.name))
          .concat((r.power_sensors || []).filter((x) => !/pv|solar|zon|opwek|inverter|omvormer|production|productie/i.test(x.entity + " " + x.name)))
          .map((x) => `<option value="${esc(x.entity)}">${esc(x.name)}</option>`).join("");
        const bats = r.batteries || [];
        $("b_found").innerHTML = bats.length ? bats.map((b, i) => `<button type="button" data-bi="${i}">🔋 ${esc(b.name)}</button>`).join("")
          : `<span class="small muted">Geen thuisbatterij gevonden in Home Assistant. Vul de instellingen hieronder zelf in.</span>`;
        document.querySelectorAll("[data-bi]").forEach((btn) => btn.onclick = () => {
          const b = bats[Number(btn.dataset.bi)];
          $("batCard").innerHTML = `<h2 class="t">Thuisbatterij</h2>` + batteryHtml(Object.assign({}, b, { soc_entity: b.soc_entity || " " }));
          $("b_on").checked = true; $("b_form").hidden = false; bindBattery();
          $("b_found").innerHTML = `<span class="small muted">Overgenomen: ${esc(b.name)}. Controleer capaciteit en vermogen en sla op.</span>`;
          B.power_charge_positive = b.power_charge_positive;
        });
        const cur = CFG.notify?.service || "";
        $("n_svc").innerHTML = `<option value="">Geen meldingen</option>` + [...new Set([...(r.notify_services || []), ...(cur ? [cur] : [])])]
          .map((v) => `<option ${v === cur ? "selected" : ""} value="${esc(v)}">${esc(v.replace("notify.mobile_app_", "📱 ").replace("notify.", ""))}</option>`).join("");
      } catch (e) {}
    })();
    $("n_test").onclick = async () => {
      const svc = $("n_svc").value; if (!svc) { $("n_res").textContent = "Kies eerst waar de melding heen moet."; return; }
      const r = await api("api/notify/test", { method: "POST", body: JSON.stringify({ service: svc }) });
      $("n_res").textContent = r.ok ? "Verstuurd. Kijk op je telefoon." : r.error;
    };
  }
  $("tokBtn").onclick = async () => {
    try {
      const v = $("s_tok").value;
      CFG = await api("api/config", { method: "POST", body: JSON.stringify({ new_token: v }) });   // alleen het wachtwoord
      token = v; try { localStorage.setItem("zs_token", v); } catch (e) {}
      toast(v ? "Wachtwoord ingesteld" : "Wachtwoord uitgezet"); settings();
    } catch (e) { setErr(e.message); }
  };
  $("saveBtn").onclick = async () => {
    const next = JSON.parse(JSON.stringify(CFG));
    readContract(c);
    next.contract = Object.assign({}, next.contract, c);
    const [lat, lon] = REGIONS[$("s_rg").value];
    Object.assign(next.solar, { kwp: Number($("s_kwp").value), azimuth: ORIENT[$("s_or").value], latitude: lat, longitude: lon,
      base_load_w: Number($("s_base").value), pv_entity: $("s_pv") ? $("s_pv").value.trim() : (next.solar.pv_entity || ""), tilt: $("s_or").value === "Oost-west" ? 15 : 35, has_panels: $("s_haspan").checked });
    Object.assign(next, meterFromForm());
    next.mqtt = $("q_host").value.trim() ? mqttConf() : {};
    next.homey = $("h_url").value.trim() ? { url: $("h_url").value.trim(), token: $("h_tok").value.trim() } : {};
    next.ocpp = { enabled: $("o_on").checked, port: Number($("o_port").value) || 8887 };
    if (CFG.has_ha) {
      next.batteries = readBattery(B);
      const ent = $("i_ent").value.trim();
      next.inverter = ent ? { entity: ent, max_w: Number($("i_max").value) || 0, unit: $("i_unit").value } : {};
      next.notify = $("n_svc").value ? { service: $("n_svc").value, tips: $("n_tips").checked, alerts: $("n_alerts").checked } : {};
    }
    try { CFG = await postCfg(next); toast("Opgeslagen"); setErr(""); }
    catch (e) { setErr(e.message); }
  };
}
const DAYL = ["ma", "di", "wo", "do", "vr", "za", "zo"];
async function editDevice(i) {
  const d = CFG.devices[i], box = $("editCard"), P = d.params || {};
  let learned = null;
  try { learned = ((await api("api/learned")).devices || []).find((x) => x.id === d.id) || null; } catch (e) {}
  const days = d.ready_days && d.ready_days.length ? d.ready_days : [0, 1, 2, 3, 4, 5, 6];
  const times = d.ready_times && d.ready_times.length ? d.ready_times : [];
  const oneShot = d.driver === "ha_start_button";
  const learnTxt = learned && learned.learned_min != null ? `Geleerd: gemiddeld ${Math.round(learned.learned_min)} min per dag (${String(learned.kwh).replace(".", ",")} kWh, ${learned.days} dagen).`
    : "Nog aan het leren: na 4 dagen met verbruik weet Zonnestuur hoe lang dit apparaat echt nodig heeft.";
  box.hidden = false;
  box.innerHTML = `<h2 class="t">${esc(d.name)} aanpassen</h2>
    <h3 class="sub-t">Algemeen</h3>
    <div class="row">
      <div class="field"><label for="e_name">Naam</label><input id="e_name" value="${esc(d.name)}" maxlength="40"></div>
      <div class="field"><label for="e_kind">Soort</label><select id="e_kind">${KINDS.map((k) => `<option value="${k.id}" ${k.id === d.kind ? "selected" : ""}>${k.label}</option>`).join("")}</select></div>
    </div>
    <div class="row">
      <div class="field" ${d.driver === "ha_current" ? "hidden" : ""}><label for="e_power">Vermogen als hij aan staat (W)</label><input id="e_power" type="number" step="50" value="${d.power_w}"></div>
      <div class="field"><label for="e_prio">Prioriteit</label><input id="e_prio" type="number" min="1" max="20" value="${d.priority}"><span class="hint">1 krijgt als eerste de zon.</span></div>
    </div>
    ${d.driver === "ha_setpoint" ? `<div class="row">
      <div class="field"><label for="e_tn">Normale temperatuur (°C)</label><input id="e_tn" type="number" step="0.5" value="${P.normal_temp}"></div>
      <div class="field"><label for="e_tb">Temperatuur bij zon of goedkope stroom (°C)</label><input id="e_tb" type="number" step="0.5" value="${P.boost_temp}"></div></div>` : ""}
    ${d.driver === "ha_current" ? `<div class="row">
      <div class="field"><label for="e_ph">Fasen</label><select id="e_ph"><option ${P.phases == 1 ? "selected" : ""}>1</option><option ${P.phases == 3 ? "selected" : ""}>3</option></select></div>
      <div class="field"><label for="e_mina">Minimaal (A)</label><input id="e_mina" type="number" min="6" max="32" value="${P.min_a}"></div>
      <div class="field"><label for="e_maxa">Maximaal (A)</label><input id="e_maxa" type="number" min="6" max="32" value="${P.max_a}"></div>
      <div class="field"><label for="e_int">Niet vaker bijsturen dan (min)</label><input id="e_int" type="number" min="0" max="60" value="${Math.round((P.min_interval_s || 0) / 60)}"></div></div>` : ""}

    ${oneShot ? "" : `<h3 class="sub-t">${d.kind === "ev" ? "Vertrektijd" : "Klaar om"}</h3>
    <p class="hint" style="margin:-4px 0 8px">Op deze tijd moet ${d.kind === "ev" ? "de auto geladen" : d.kind === "boiler" ? "het water warm" : "het apparaat klaar"} zijn. Lukt dat niet met zon of goedkope uren, dan haalt Zonnestuur het laatste stuk van het net.</p>
    <div id="e_times">${(times.length ? times : [""]).map((t) => `<div class="row time-row"><div class="field" style="flex:0 1 160px"><input type="time" class="e_t" value="${esc(t)}" aria-label="Tijd"></div><button type="button" class="btn ghost small e_rm" aria-label="Tijd weghalen">✕</button></div>`).join("")}</div>
    <button type="button" class="btn ghost small" id="e_addt" style="margin:4px 0 10px">+ Nog een tijd</button>
    <div class="days" id="e_days" role="group" aria-label="Op welke dagen">${DAYL.map((l, k) => `<button type="button" data-d="${k}" class="${days.includes(k) ? "on" : ""}" aria-pressed="${days.includes(k)}">${l}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="e_g">Zoveel minuten ervoor mag hij van het net bijladen</label><input id="e_g" type="number" min="0" step="15" value="${d.guarantee_min}"><span class="hint">0 = geen garantie, alleen zon en goedkope uren.</span></div>
      <div class="field"><label for="e_look">Telt als klaar als hij binnen zoveel uur ervoor vol was</label><input id="e_look" type="number" min="1" max="24" step="0.5" value="${d.full_lookback_h}"></div>
    </div>`}

    <h3 class="sub-t">Hoe lang per dag</h3>
    <label class="check-row"><input type="checkbox" id="e_learn" ${d.learn_run === false ? "" : "checked"}> Zelf leren uit wat ${esc(d.name)} echt gebruikt <span class="muted">(aanbevolen)</span></label>
    <p class="hint" style="margin:6px 0 8px">${esc(learnTxt)}</p>
    <div class="row"><div class="field" style="flex:0 1 260px"><label for="e_run">${d.learn_run === false ? "Looptijd per dag (min)" : "Tot er genoeg geleerd is (min per dag)"}</label><input id="e_run" type="number" min="0" step="15" value="${d.expected_run_min}"></div></div>

    <details><summary>Geavanceerd: reageren op zon</summary><div class="row" style="margin-top:12px">
      <div class="field"><label for="e_start">Aan bij overschot van (W)</label><input id="e_start" type="number" step="50" value="${d.start_surplus_w ?? ""}" placeholder="automatisch (90% van vermogen)"></div>
      <div class="field"><label for="e_sd">…gedurende (s)</label><input id="e_sd" type="number" step="10" value="${d.start_delay_s}"></div>
      <div class="field"><label for="e_stop">Uit bij afname van meer dan (W)</label><input id="e_stop" type="number" step="50" value="${d.stop_import_w}"></div>
      <div class="field"><label for="e_xd">…gedurende (s)</label><input id="e_xd" type="number" step="10" value="${d.stop_delay_s}"></div>
    </div><div class="row">
      <div class="field"><label for="e_minon">Minimaal aan (min)</label><input id="e_minon" type="number" min="0" value="${Math.round(d.min_on_s / 60)}"></div>
      <div class="field"><label for="e_minoff">Minimaal uit (min)</label><input id="e_minoff" type="number" min="0" value="${Math.round(d.min_off_s / 60)}"></div>
    </div>
    <label class="check-row"><input type="checkbox" id="e_full" ${d.detect_full === false ? "" : "checked"}> Herken 'vol': staat aan maar neemt geen stroom meer op (thermostaat klaar, auto vol)</label>
    </details>
    <div class="actions"><button class="btn danger small" id="e_del">Verwijderen</button>
      <div class="row"><button class="btn ghost small" id="e_cancel">Annuleren</button><button class="btn small" id="e_save">Opslaan</button></div></div>`;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  const bindRm = () => box.querySelectorAll(".e_rm").forEach((b) => b.onclick = () => { const rows = box.querySelectorAll(".time-row"); if (rows.length > 1) b.closest(".time-row").remove(); else rows[0].querySelector("input").value = ""; });
  bindRm();
  if ($("e_addt")) $("e_addt").onclick = () => { $("e_times").insertAdjacentHTML("beforeend", `<div class="row time-row"><div class="field" style="flex:0 1 160px"><input type="time" class="e_t" aria-label="Tijd"></div><button type="button" class="btn ghost small e_rm" aria-label="Tijd weghalen">✕</button></div>`); bindRm(); };
  box.querySelectorAll("#e_days button").forEach((b) => b.onclick = () => { b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); });
  $("e_cancel").onclick = () => { box.hidden = true; };
  let confirmDel = false;
  $("e_del").onclick = async () => {
    if (!confirmDel) { confirmDel = true; $("e_del").textContent = "Echt verwijderen?"; return; }
    const next = JSON.parse(JSON.stringify(CFG)); next.devices.splice(i, 1);
    try { CFG = await postCfg(next); toast("Verwijderd"); settings(); } catch (e) { setErr(e.message); }
  };
  $("e_save").onclick = async () => {
    const next = JSON.parse(JSON.stringify(CFG)), n = next.devices[i];
    const num = (id, dflt) => { const v = Number($(id).value); return $(id).value === "" || isNaN(v) ? dflt : v; };
    n.name = $("e_name").value.trim() || n.name; n.kind = $("e_kind").value; n.power_w = num("e_power", n.power_w);
    n.priority = num("e_prio", 1) || 1;
    if (!oneShot) {
      n.ready_times = [...new Set([...box.querySelectorAll(".e_t")].map((x) => x.value).filter(Boolean))].sort();
      const dd = [...box.querySelectorAll("#e_days button.on")].map((b) => Number(b.dataset.d));
      if (!dd.length) { setErr("Kies minstens één dag, of haal de tijd weg."); return; }
      n.ready_days = dd.length === 7 ? [] : dd;
      n.guarantee_min = Math.max(0, num("e_g", 0)); n.full_lookback_h = Math.max(1, num("e_look", 4));
    }
    n.learn_run = $("e_learn").checked; n.expected_run_min = Math.max(0, num("e_run", 150));
    n.start_surplus_w = $("e_start").value === "" ? null : num("e_start", null); n.start_delay_s = Math.max(0, num("e_sd", 60));
    n.stop_import_w = num("e_stop", 300); n.stop_delay_s = Math.max(0, num("e_xd", 120));
    n.min_on_s = Math.max(0, num("e_minon", 10)) * 60; n.min_off_s = Math.max(0, num("e_minoff", 5)) * 60; n.detect_full = $("e_full").checked;
    if ($("e_tn")) { n.params.normal_temp = num("e_tn", n.params.normal_temp); n.params.boost_temp = num("e_tb", n.params.boost_temp); }
    if ($("e_ph")) {
      Object.assign(n.params, { phases: Number($("e_ph").value), min_a: Math.max(6, num("e_mina", 6)), max_a: Math.min(32, num("e_maxa", 16)),
        min_interval_s: Math.max(0, num("e_int", 0)) * 60 });
      n.power_w = Math.min(25000, n.params.max_a * 230 * n.params.phases);
    }
    try { CFG = await postCfg(next); toast("Opgeslagen"); setErr(""); settings(); } catch (e) { setErr(e.message); }
  };
}

// ---------- start ----------
(async () => {
  try {
    CFG = await api("api/config");
    if (CFG.solar) { W.solar.kwp = CFG.solar.kwp; W.solar.region = nearestRegion(CFG.solar.latitude, CFG.solar.longitude); W.noPanels = CFG.solar.has_panels === false; }
    if (CFG.contract) Object.assign(W.contract, CFG.contract);
    if (CFG.has_ha) W.ha.url = CFG.homeassistant?.url || "";
    if (MODE === "settings") {
      if (!CFG.configured) { location.href = "setup"; return; }
      document.title = "Zonnestuur · instellingen"; settings();
    } else {
      if (W.addOnly && !CFG.configured) W.addOnly = false;
      go(0);
    }
  } catch (e) { setErr("Kan Zonnestuur niet bereiken. " + e.message); }
})();
</script>
